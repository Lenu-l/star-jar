<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>星星罐罐 · 把坚持变成看得见的资产</title>
<!-- 手机桌面图标 / PWA（GitHub Pages 部署时与 index.html 同目录） -->
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FFF6E3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="星星罐罐">
<!-- Service Worker：network-first，保证发新版后手机端立刻可见（不再被旧缓存挡住）；
     同时保留离线可用。注册失败（如 file:// 或沙箱预览）时静默忽略，不影响正常使用。 -->
<script>
if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
<style>
/* ============ 基础 ============ */
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root{
  --ink:#6B5D57; --ink-soft:#A08D80; --ink-faint:#C9B8A8;
  --cream:#FFFDF8; --paper:#FFF6E8; --line:#E8D5B8;
  --yellow:#FFD66B; --blue:#93C9F7; --pink:#FFA9C9; --mint:#8FDCC2; --lav:#C3AEF2;
  --orange:#FF9A5C; --brown:#E0A458; --brown-dk:#8C5A2B;
  --shadow:0 4px 0 rgba(140,90,43,.22);
}
html,body{ height:100%; overflow:hidden; background:#FBF3E4;
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  color:var(--ink); }
button{ font-family:inherit; border:none; background:none; cursor:pointer; color:inherit; }
input{ font-family:inherit; }
#app{ position:fixed; inset:0; overflow:hidden; background:#FBF3E4;
  --sk:1;                                   /* 场景缩放系数：手机端放大一点，少留空 */
  --scy:50%;                                /* 场景垂直中心：竖屏下移，避免画面顶在上面、底部空一大截 */ }
#stage{ position:absolute; left:50%; top:var(--scy); transform:translate(-50%,-50%);
  width:min(calc(100vw * var(--sk)), calc(100vh * 4 / 3));
  height:min(100vh, calc(100vw * var(--sk) * 3 / 4));
  display:block; touch-action:none; image-rendering:pixelated; background:#FBF3E4; }
/* 精灵专属顶层画布：覆盖在所有场景/装饰/罐子乃至左栏之上（z-index 高于左栏 18、低于标语气泡 28），
   本身透明且 pointer-events:none —— 既不挡左栏点击，又保证小精灵永远在最上层、不会被任何物品穿透 */
#sprite-layer{ position:absolute; left:50%; top:var(--scy); transform:translate(-50%,-50%);
  width:min(calc(100vw * var(--sk)), calc(100vh * 4 / 3));
  height:min(100vh, calc(100vw * var(--sk) * 3 / 4));
  z-index:40; pointer-events:none; image-rendering:pixelated; }
/* 竖屏：① 场景适度放大（1.2×）——contain 下 4:3 画面在高屏手机上只占三分之一高、上下大片留白，
   放大后更饱满；左右各裁掉约 10% 最外圈纯墙面，花环(x110–710)/盆栽/礼品罐/摆件均完整可见。
   ② 场景整体下移（54vh），画面不再顶在上方、底部空区收窄。
   ③ 用 min/max 钳制：矮屏自动上移，保证「场景 + 精灵状态牌 + 打卡台」三者都塞得下；
      同时不低于顶部横滑条下沿，避免压住目标卡片。 */
@media (orientation: portrait){
  #app{ --sk:1.2;
    --scy: max(calc(118px + 45vw), min(54vh, calc(100vh - 195px - 45vw))); }
}

/* ============ 顶部 HUD ============ */
#hud{ position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between;
  align-items:flex-start; padding:14px 16px; pointer-events:none; z-index:20; }
.hud-card{ background:var(--paper); border:3px solid var(--line); border-radius:14px;
  padding:6px 12px; box-shadow:var(--shadow); pointer-events:auto; }
.hud-streak{ display:flex; align-items:center; gap:8px; }
.hud-streak .num{ font-size:24px; font-weight:800; color:var(--brown-dk); line-height:1; }
.hud-star{ width:24px; height:24px; flex:none; }
.hud-right{ display:flex; gap:8px; align-items:center; }
.hud-total{ font-size:11px; color:var(--ink-soft); }
.hud-total b{ font-size:15px; color:var(--ink); }
.hud-left{ display:flex; gap:8px; align-items:center; }
.hud-days{ display:flex; align-items:center; gap:6px; font-size:14px; font-weight:700;
  color:var(--brown-dk); letter-spacing:.5px; }
.hud-days .emoji{ font-size:18px; line-height:1; }
.hud-days b{ font-size:20px; color:#E07A3C; }
.icon-btn{ width:34px; height:34px; border-radius:10px; background:var(--paper);
  border:3px solid var(--line); box-shadow:var(--shadow); display:flex; align-items:center;
  justify-content:center; font-size:15px; pointer-events:auto; transition:transform .12s; }
.icon-btn:active{ transform:translateY(2px); box-shadow:0 2px 0 rgba(140,90,43,.22); }

/* ============ 底部 dock ============ */
#dock{ position:absolute; left:50%; transform:translateX(-50%); bottom:12px; z-index:30;
  display:flex; align-items:center; gap:6px; padding:6px 10px;
  background:var(--paper); border:3px solid var(--line); border-radius:18px;
  box-shadow:0 5px 0 rgba(140,90,43,.22); max-width:94vw; }
.jar-btn{ position:relative; width:40px; height:40px; border-radius:12px; flex:none;
  border:3px solid var(--paper); box-shadow:0 3px 0 rgba(140,90,43,.28);
  display:flex; align-items:center; justify-content:center; transition:transform .18s; overflow:hidden; }
.jar-btn::after{ content:""; position:absolute; left:0; right:0; bottom:0; height:8px; background:rgba(0,0,0,.14); }
.jar-btn:active{ transform:translateY(2px); }
.jar-btn.active{ transform:scale(1.12) translateY(-2px); border-color:var(--ink); }
.jar-btn .glyph{ font-size:16px; }
.jar-btn .badge{ position:absolute; top:-6px; right:-6px; width:14px; height:14px; border-radius:50%;
  background:var(--paper); border:2px solid var(--line); display:none; align-items:center; justify-content:center; }
.jar-btn .badge::after{ content:""; width:6px; height:6px; background:var(--brown-dk); }
.jar-btn.done .badge{ display:flex; }
#check-btn{ position:relative; width:60px; height:60px; border-radius:18px; flex:none; margin:0 4px;
  background:var(--brown);
  border:3px solid var(--paper); box-shadow:0 5px 0 var(--brown-dk), inset 0 3px 0 rgba(255,255,255,.35);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
  color:#fff; transition:transform .12s; }
#check-btn:active{ transform:translateY(3px); box-shadow:0 2px 0 var(--brown-dk); }
#check-btn .glyph{ font-size:19px; line-height:1; }
#check-btn .txt{ font-size:10px; font-weight:700; letter-spacing:2px; }
#check-btn.pulse{ animation:btnPulse 1.6s ease-in-out infinite; }
@keyframes btnPulse{ 0%,100%{ box-shadow:0 5px 0 var(--brown-dk), 0 0 0 0 rgba(255,214,107,.5); }
  50%{ box-shadow:0 5px 0 var(--brown-dk), 0 0 0 9px rgba(255,214,107,0); } }

/* ============ 左侧目标栏 ============ */
#jar-rail{ position:absolute; left:10px; top:72px; bottom:12px; z-index:18;
  display:flex; flex-direction:column; gap:8px; width:106px; pointer-events:none; }
#rail-list{ display:flex; flex-direction:column; gap:8px; overflow-y:auto; flex:1; padding-right:2px; }
#rail-list::-webkit-scrollbar{ width:0; }
.jar-card{ position:relative; width:100%; text-align:left; border:3px solid var(--c, var(--brown));
  border-left:9px solid var(--c, var(--brown)); background:var(--ctint, var(--paper)); border-radius:14px;
  box-shadow:0 3px 0 rgba(140,90,43,.16); padding:7px 8px; display:flex; flex-direction:column; gap:1px;
  transition:transform .15s, box-shadow .15s, background .15s, border-color .15s; pointer-events:auto; }
.jar-card:active{ transform:translateY(2px); }
.jar-card.active{ border-color:var(--c); background:var(--c); transform:translateX(3px) scale(1.04);
  box-shadow:0 5px 12px rgba(0,0,0,.18); }
.jar-card .jc-glyph{ font-size:16px; line-height:1; width:28px; height:28px; border-radius:9px;
  display:flex; align-items:center; justify-content:center; background:var(--c, var(--brown));
  box-shadow:0 1px 3px rgba(0,0,0,.15); margin-bottom:2px; border:2px solid rgba(255,255,255,.85); position:relative; }
.jar-card.active .jc-glyph{ background:#fff; }
.jc-name{ font-size:12px; font-weight:800; color:var(--ink); line-height:1.2;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.jar-card.active .jc-name{ color:var(--ink); }
.jc-meta{ font-size:10px; color:var(--ink-soft); }
.jar-card.active .jc-meta{ color:rgba(60,40,25,.82); }
/* 今日已打卡：在头像右下角点一个小对勾徽标（不再占用右上角，留给删除按钮） */
.jar-card.done .jc-glyph::after{ content:"✓"; position:absolute; right:-5px; bottom:-5px; width:15px; height:15px;
  display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:800; color:#fff;
  background:var(--c); border:1.5px solid #fff; border-radius:50%; }
.jar-card.active.done .jc-glyph::after{ background:#fff; color:var(--c); }
/* 每张卡片右上角的删除按钮（不小心建错的罐子可随时删掉） */
.jar-card .jc-del{ position:absolute; top:3px; right:4px; width:18px; height:18px; line-height:16px; text-align:center;
  font-size:14px; font-weight:800; color:#fff; background:rgba(206,72,72,.92); border:1.5px solid rgba(255,255,255,.75);
  border-radius:50%; cursor:pointer; z-index:3; padding:0; }
.jar-card .jc-del:active{ transform:scale(.86); }
.rail-add{ flex:none; width:100%; height:38px; font-size:22px; font-weight:800; color:var(--brown-dk);
  background:var(--paper); border:3px dashed var(--line); border-radius:14px; box-shadow:0 3px 0 rgba(140,90,43,.18);
  pointer-events:auto; }
.rail-add:active{ transform:translateY(2px); }

/* ============ 当前目标卡片 ============ */
.hud-goal{ display:flex; align-items:center; gap:7px; padding:6px 10px; }
.hud-goal .hg-emoji{ font-size:18px; line-height:1; flex:none; }
.hud-goal .hg-txt{ display:flex; flex-direction:column; line-height:1.2; min-width:0; }
.hud-goal .hg-name{ font-size:13px; font-weight:800; color:var(--ink);
  max-width:128px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.hud-goal .hg-meta{ font-size:10px; color:var(--ink-soft); }

/* ============ 三步悬浮食材 ============ */
#step-bar{ position:absolute; z-index:25; display:none; gap:16px; transform:translate(-50%,-50%); }
#step-bar.show{ display:flex; }
.step-btn{ position:relative; width:60px; height:60px; border-radius:16px;
  background:var(--paper); border:3px solid var(--line);
  box-shadow:0 4px 0 rgba(140,90,43,.25);
  display:flex; align-items:center; justify-content:center;
  animation:floaty 2.2s steps(4) infinite; transition:transform .15s, border-color .2s; }
.step-btn:nth-child(2){ animation-delay:.35s; }
.step-btn:nth-child(3){ animation-delay:.7s; }
.step-btn canvas{ width:44px; height:44px; image-rendering:pixelated; }
.step-btn .no{ position:absolute; top:-8px; left:-8px; width:20px; height:20px; border-radius:50%;
  background:var(--brown-dk); color:#fff; font-size:11px; font-weight:800;
  display:flex; align-items:center; justify-content:center; border:2px solid var(--paper); }
.step-btn:active{ transform:translateY(2px); box-shadow:0 2px 0 rgba(140,90,43,.25); }
.step-btn.next{ border-color:var(--brown); }
.step-btn.done{ opacity:.5; }
.step-btn.done canvas{ filter:saturate(.5); }
@keyframes floaty{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-6px); } }

/* ============ 弹层 ============ */
#modal-layer{ position:absolute; inset:0; z-index:50; display:none; align-items:center; justify-content:center;
  background:rgba(107,93,87,.34); padding:18px; }
#modal-layer.show{ display:flex; }
.modal{ width:min(430px,94vw); max-height:88vh; overflow-y:auto; background:var(--cream);
  border:3px solid var(--line); border-radius:18px; box-shadow:0 8px 0 rgba(107,93,87,.3);
  padding:20px; animation:popIn .3s steps(6); }
@keyframes popIn{ from{ transform:scale(.85); opacity:0; } to{ transform:scale(1); opacity:1; } }
.modal h2{ font-size:18px; margin-bottom:4px; }
.modal .sub{ font-size:12px; color:var(--ink-soft); margin-bottom:16px; }
.field{ margin-bottom:16px; }
.field label{ display:block; font-size:13px; font-weight:700; margin-bottom:8px; }
.field input[type=text]{ width:100%; padding:10px 12px; border:3px solid var(--line); border-radius:10px;
  font-size:14px; color:var(--ink); background:#fff; outline:none; }
.field input[type=text]:focus{ border-color:var(--brown); }
.opt-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.opt{ border:3px solid var(--line); border-radius:12px; padding:9px 6px; text-align:center;
  background:#fff; transition:all .15s; box-shadow:0 3px 0 rgba(140,90,43,.15); }
.opt .ic{ font-size:20px; }
.opt .nm{ font-size:12px; font-weight:700; margin-top:3px; }
.opt .ds{ font-size:10px; color:var(--ink-faint); margin-top:1px; }
.opt.sel{ border-color:var(--brown-dk); background:#FFF3D8; transform:scale(1.04); }
.opt.sel .nm{ color:var(--brown-dk); }
.btn-row{ display:flex; gap:10px; margin-top:18px; }
.btn{ flex:1; padding:12px; border-radius:12px; font-size:14px; font-weight:700; text-align:center;
  transition:transform .12s; }
.btn:active{ transform:translateY(2px); }
.btn-primary{ background:var(--brown); color:#fff; box-shadow:0 4px 0 var(--brown-dk); }
.btn-primary:active{ box-shadow:0 2px 0 var(--brown-dk); }
.btn-ghost{ background:var(--paper); color:var(--ink-soft); border:3px solid var(--line); box-shadow:0 3px 0 rgba(140,90,43,.18); }
.btn-danger{ background:#fff; color:#D06A6A; border:3px solid #F0C4C4; }

/* ============ 统计页 ============ */
.stat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:16px; }
.stat-box{ background:var(--paper); border:3px solid var(--line); border-radius:12px; padding:12px 8px; text-align:center; }
.stat-box .v{ font-size:20px; font-weight:800; color:var(--brown-dk); }
.stat-box .k{ font-size:11px; color:var(--ink-soft); margin-top:2px; }
.cal{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
.cal .dow{ text-align:center; font-size:10px; color:var(--ink-faint); padding:3px 0; }
.cal .day{ aspect-ratio:1; border-radius:6px; background:#fff; border:2px solid #F0E2CC;
  display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--ink-faint); }
.cal .day.on{ background:var(--brown); color:#fff; border-color:var(--brown-dk); font-weight:700; }
.cal .day.today{ border-color:var(--brown-dk); color:var(--brown-dk); font-weight:800; }
.cal .day.empty{ background:transparent; border:none; }
.io-row{ display:flex; gap:10px; margin-top:16px; }

/* ============ toast ============ */
#toast{ position:absolute; top:74px; left:50%; transform:translateX(-50%) translateY(-8px); z-index:60;
  background:var(--paper); border:3px solid var(--line); border-radius:0;
  padding:8px 16px; font-size:13px; font-weight:600; box-shadow:var(--shadow);
  opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; white-space:nowrap; }
#toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

/* 小精灵标语气泡：出现在精灵右上角、绝不挡住精灵本体；右侧放不下时翻到左上角 */
#sprite-speech{ position:absolute; z-index:45; max-width:160px; pointer-events:none;
  background:var(--paper); border:2px solid var(--line); border-radius:11px;
  padding:6px 10px; font-size:12px; font-weight:700; color:var(--brown-dk); text-align:center;
  box-shadow:var(--shadow); line-height:1.3; white-space:normal; word-break:break-word;
  transform:translate(0,-100%) scale(.9); opacity:0;
  transition:opacity .22s ease, transform .22s ease; }
#sprite-speech.show{ opacity:1; transform:translate(0,-100%) scale(1); }
#sprite-speech::after{ content:""; position:absolute; left:16px; bottom:-10px;
  border:5px solid transparent; border-top-color:var(--line); }
#sprite-speech::before{ content:""; position:absolute; left:17px; bottom:-6px;
  border:4px solid transparent; border-top-color:var(--paper); z-index:1; }

/* 荣誉柜目标名牌：柜顶小木牌（DOM 文字，随画面缩放；写清柜子里是哪个目标的成就） */
#medal-plate{ position:absolute; left:0; top:0; z-index:34; transform:translate(-50%,0);
  background:linear-gradient(180deg,#F6E4C4,#EBD3A9);
  border:2px solid #B98A5C; border-radius:9px;
  padding:1px 8px; font-size:12px; font-weight:800; color:#7A5A3A;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  box-shadow:0 2px 0 rgba(140,90,43,.18);
  pointer-events:none; user-select:none; font-family:inherit; }
/* 小精灵状态牌：画面里专属区域（名字 / 心情 / 喂食机会）。位置由 positionSpriteCard()
   按逻辑坐标计算（宽屏放最右墙面：画框下/摆件上；中窗降级左壁口袋；竖屏放可见区顶部），避开左栏/HUD/罐子/盆栽 */
#sprite-card{ position:absolute; left:0; top:0; z-index:35; width:198px;
  background:linear-gradient(180deg,#FFFDF7,#FFF1DC);
  border:3px solid var(--line); border-radius:16px;
  box-shadow:0 6px 0 rgba(140,90,43,.16), 0 9px 18px rgba(120,80,40,.18);
  padding:10px 12px; color:var(--ink); user-select:none; font-family:inherit; }
#sprite-card.compact{ width:150px; padding:8px 10px; }
#sprite-card.compact .sc-name{ font-size:13px; }
#sprite-card.compact .sc-mood{ font-size:12px; margin-top:6px; padding:4px 7px; }
#sprite-card.compact .sc-feed{ font-size:11px; margin-top:6px; }
#sprite-card.compact .sc-feed-btn{ font-size:13px; padding:7px 0; margin-top:7px; }
#sprite-card.slim{ width:118px; padding:7px 9px; border-radius:14px; }
#sprite-card.slim .sc-rename{ display:none; }        /* 窄屏隐藏改名按钮，点名字本身即可改名 */
#sprite-card.slim .sc-feed{ display:none; }          /* 机会数并入喂食按钮文案 */
#sprite-card.slim .sc-name{ font-size:13px; max-width:100%; }
#sprite-card.slim .sc-mood{ font-size:12px; margin-top:6px; padding:4px 7px; }
#sprite-card.slim .sc-feed-btn{ font-size:12px; padding:7px 0; margin-top:7px; }
#sprite-card.night{ background:linear-gradient(180deg,#3A3357,#2E2848); border-color:#5A4F7A; color:#FDF3E0;
  box-shadow:0 6px 0 rgba(0,0,0,.30), 0 9px 18px rgba(0,0,0,.35); }
.sc-head{ display:flex; align-items:center; justify-content:space-between; gap:6px; }
.sc-name{ font-size:15px; font-weight:800; cursor:pointer; display:flex; align-items:center;
  min-width:0; max-width:132px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sc-name .ph{ color:#B89B7E; font-weight:700; font-size:13px; }
#sprite-card.night .sc-name .ph{ color:#C9BEE6; }
.sc-rename{ border:none; background:rgba(255,255,255,.6); border-radius:8px; font-size:13px;
  cursor:pointer; padding:2px 6px; line-height:1; }
#sprite-card.night .sc-rename{ background:rgba(255,255,255,.12); }
.sc-mood{ display:flex; align-items:center; gap:6px; margin-top:8px;
  background:rgba(255,255,255,.55); border-radius:10px; padding:5px 8px; font-size:13px; font-weight:700; }
#sprite-card.night .sc-mood{ background:rgba(255,255,255,.10); }
.sc-mood .me{ font-size:17px; }
.sc-feed{ display:flex; align-items:center; justify-content:space-between; margin-top:8px;
  font-size:12px; font-weight:700; opacity:.85; }
.sc-feed-count{ font-size:14px; }
.sc-feed-btn{ margin-top:9px; width:100%; border:none; cursor:pointer;
  border-radius:12px; padding:9px 0; font-size:14px; font-weight:800; color:#6B3D12;
  background:linear-gradient(180deg,#FFE6A6,#FFC56B); box-shadow:0 4px 0 #E0A23E;
  display:flex; align-items:center; justify-content:center; gap:6px; transition:transform .08s ease; }

/* 移动端 / 竖屏优化：整幅场景完整显示（contain，不裁切），罐子会变小但植物/装饰/礼品罐都看得见；
   顶部 HUD 单行紧凑、左侧目标栏改成 HUD 下方横向滚动条（不再压在场景左侧）、精灵状态牌移到场景下方空白区 */

     放大后画面更饱满；左右各裁掉约 10% 的最外圈纯墙面，花环(x110–710)/盆栽/礼品罐/摆件均完整可见 */
  #app{ --sk:1.2; }

  #jar-rail{ left:8px; right:8px; top:calc(54px + env(safe-area-inset-top)); bottom:auto; width:auto;

}
/* 超窄屏（≤380px）：再收一点，保证 HUD 单行不被裁切 */
@media (max-width:380px){
  .hud-days{ font-size:10px; }
  .hud-total{ display:none; }

<script>

/* ============================================================
   星星罐罐 —— 把坚持变成看得见的资产

/* ---------- 工具 ---------- */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp = (a,b,t) => a + (b-a)*t;
const rnd = (a,b) => a + Math.random()*(b-a);
const rint = (a,b) => Math.floor(rnd(a,b+1));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const todayStr = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); };
const dayDiff = (a,b) => Math.round((new Date(b) - new Date(a)) / 86400000);
const ease = {
  out:  t => 1 - Math.pow(1-t, 3),
  back: t => { const c=1.70158; return 1 + (c+1)*Math.pow(t-1,3) + c*Math.pow(t-1,2); },
  elastic: t => t===0||t===1 ? t : Math.pow(2,-10*t)*Math.sin((t*10-0.75)*(2*Math.PI/3)) + 1
};

/* ---------- 主题与食物图鉴 ----------
   每款食物 = 胚体(base) + 涂层(coat) + 点缀(top) 三件套，
   三件套各是一个像素绘制函数，参数 G(x,y,w,h,color) 在 16x16 网格中作画。
   theme.color 决定罐子/dock/环境光；decor 决定房间装饰类型。 */

{ id:"dessert", name:"甜品站", color:"#FFA9C9", dark:"#E57FA3", glyph:"🧁", decor:"tray",

const THEME_MAP = Object.fromEntries(THEMES.map(t=>[t.id,t]));

/* 食物三件套绘制（16x16 网格，中心 8,8） */
const FOODS = {
/* ---- 甜品站 ---- */
donut:{ name:"甜甜圈", emoji:"🍩", grid:70, cx:35, ringR:21.5,
  /* 逐格距离场画圆环：网格从 28 提升到 70 → 放大后每个艺术像素更小、圆环更细腻 */
  ring:(x,y)=>{ const dx=x-35, dy=y-35; return Math.sqrt(dx*dx+dy*dy); },
  base:G=>{
    const R=31, hr=12.25;
    for(let y=0;y<70;y++) for(let x=0;x<70;x++){
      const d=Math.sqrt((x+0.5-35)**2+(y+0.5-35)**2);
      if(d>R+1.0 || d<hr-0.6) continue;
      if(d>R-0.5){ G(x,y,1,1,"#5C4A3A"); continue; }      /* 外圈连续墨边 */
      const dx=x+0.5-35, dy=y+0.5-35;
      const t=(-dx-dy+45)/90;
      const col = t>0.72 ? "#FFE3B0" : t>0.4 ? "#F5C97E" : "#E0A86A";
      G(x,y,1,1,col);
    }
  },
  coat:G=>{
    const R=31, hr=12.25;
    for(let y=0;y<70;y++) for(let x=0;x<70;x++){
      const d=Math.sqrt((x+0.5-35)**2+(y+0.5-35)**2);
      if(d>R-0.5 || d<hr-0.4) continue;                  /* 不盖住墨边与孔 */
      const dx=x+0.5-35, dy=y+0.5-35;
      const t=(-dx-dy+45)/90;
      const col = t>0.72 ? "#FFD6E8" : t>0.4 ? "#FFB3D4" : "#FF9EC4";
      G(x,y,1,1,col);
    }
  },
  top:G=>{ /* 糖针（五色板，沿环带确定性排布，只落在糖霜上） */
    const SPR=["#FFFFFF","#FF8FB8","#6FA8E8","#A78BE0","#5FBFA0"];
    for(let k=0;k<28;k++){
      const a=k/28*Math.PI*2, r=21+(k%3-1)*2.75;
      const x=Math.round(35+Math.cos(a)*r), y=Math.round(35+Math.sin(a)*r);
      const d=Math.sqrt((x+0.5-35)**2+(y+0.5-35)**2);
      if(d>12 && d<28) G(x,y,1,1, SPR[k%5]);
    }
  } },

/* 第 10 枚限定款：彩虹涂层（只落在糖霜环带，不走样） */
function rainbowCoat(G, foodId){
  const f = FOODS[foodId]; const G2=f.grid||16; const OFF=f.cx||8;
  const cols=["#FF9EC4","#FFD66B","#8FDCC2","#93C9F7","#C3AEF2","#FF9A5C"];
  if(f.ring){ /* 有环食物：沿糖霜环带按 y 行铺彩虹（甜甜圈） */
    for(let y=0;y<G2;y++) for(let x=0;x<G2;x++){
      const d=f.ring(x+0.5,y+0.5);
      if(d>5 && d<11){ const bi=Math.floor(y/G2*cols.length)%cols.length; G(x,y,1,1,cols[bi]); }
    }
  } else { /* 无环食物：沿用旧版分段 */
    const bands=[ {y:4,segs:[[6,4]]}, {y:5,segs:[[5,6]]}, {y:6,segs:[[5,6]]},
      {y:7,segs:[[4,2],[10,2]]}, {y:8,segs:[[4,2],[10,2]]},
      {y:9,segs:[[5,6]]}, {y:10,segs:[[5,6]]}, {y:11,segs:[[6,4]]} ];
    bands.forEach((b,bi)=>{ const c=cols[bi%cols.length];
      for(const [x,w] of b.segs) for(let k=0;k<w;k++) G(x+k,b.y,1,1,c); });
  }
}

/* ---------- 糖霜配方：混色不设限 ----------
   每枚入罐时记录一份配方（风格 + 色值 + 种子），刷新/导出不变形；
   主题色只是默认倾向，搭配色每次现抽，罐子里没有两枚相同的。 */
const FROST_STYLES = ["solid","half","swirl","carnival","drip"];
/* 糖霜双色配对（初版 demo 的五组 pastel 对） */
const FROST_PAIRS = {
  dessert:["#FFA9C9","#FF8FB8"], seafood:["#93C9F7","#6FA8E8"],
  fruit:["#8FDCC2","#5FBFA0"], breakfast:["#FFD66B","#F2BC45"],
  bbq:["#FF9A5C","#E07A3C"], oden:["#E0A458","#C97B2E"],
};
const FROST_ACCENTS = ["#93C9F7","#FFD66B","#8FDCC2","#C3AEF2","#FF9A5C","#F5C97E","#FFFFFF"];
function shadeHex(hex,f){ const n=parseInt(hex.slice(1),16);
  return "#"+[(n>>16&255),(n>>8&255),(n&255)]
    .map(v=>Math.round(clamp(v*f,0,255)).toString(16).padStart(2,"0")).join(""); }
function lumHex(hex){ const n=parseInt(hex.slice(1),16);
  return .299*(n>>16&255)+.587*(n>>8&255)+.114*(n&255); }
function genFrost(jar){
  const theme = THEME_MAP[jar.themeId] || THEMES[0];
  const pr = FROST_PAIRS[theme.id] || [theme.color, theme.dark];
  return { style: pick(FROST_STYLES), c1: pr[0],
    c2: Math.random()<.5 ? pr[1] : pick(FROST_ACCENTS.filter(c=>c!==pr[0])),
    c3: pick(["#FFFFFF","#FFF3C9"]),
    seed: Math.floor(Math.random()*9999) };
}
function paintCoatVariant(G, foodId, frost){
  const f = FOODS[foodId]; if(!f) return;
  const G2 = f.grid || 16;                       /* 食物的本地网格分辨率（甜甜圈=70，其他=32） */
  const OFF = f.cx || 8;                         /* 食物本地网格的中心（甜甜圈=35，其他=16） */
  /* 1. 记录默认涂层色（按亮度排序，保证明暗结构不变） */
  const defs = [];
  f.coat((x,y,w,h,col)=>{ if(!defs.includes(col)) defs.push(col); });
  defs.sort((a,b)=>lumHex(a)-lumHex(b));
  /* 2. 变体色板逐色映射 */
  const map = {};
  if(frost.style==="half"){ /* 双色对半：defs 按明暗交替分到两个色系，系内越亮越浅 */
    const p1 = [frost.c1, shadeHex(frost.c1,1.12), shadeHex(frost.c1,1.25)];
    const p2 = [frost.c2, shadeHex(frost.c2,1.12), shadeHex(frost.c2,1.25)];
    defs.forEach((c,i)=>{ map[c] = (i%2===0?p1:p2)[Math.min(i>>1,2)]; });
  } else { /* 单色系：主色=c1，原越亮的细节越浅（保持明暗结构，不出脏色） */
    const p = [frost.c1, shadeHex(frost.c1,1.1), shadeHex(frost.c1,1.22), shadeHex(frost.c1,1.35)];
    defs.forEach((c,i)=>{ map[c] = p[Math.min(i,p.length-1)]; });
  }
  /* 3. 过映射重画涂层，同时记录覆盖 Mask（按食物本地网格） */
  const mask = new Set();
  const rec = (gx,gy,gw,gh,col)=>{
    for(let yy=Math.floor(gy); yy<Math.ceil(gy+gh); yy++)
      for(let xx=Math.floor(gx); xx<Math.ceil(gx+gw); xx++)
        if(xx>=0&&xx<G2&&yy>=0&&yy<G2) mask.add(yy*G2+xx);
    G(gx,gy,gw,gh, map[col]||col);
  };
  f.coat(rec);
  /* 4. 风格叠加层：只落在涂层覆盖处，食物形状不走样（种子固定，重渲染一致） */
  const sr = seedRand(frost.seed||1);
  const at = (xx,yy)=>mask.has((yy|0)*G2+(xx|0));
  const dot = (xx,yy,col)=>{ if(at(xx,yy)) G(xx,yy,1,1,col); };
  const hi = G2-2;
  if(frost.style==="swirl"){ /* 大理石纹：一道波浪线 */
    const ph = sr()*6;
    for(let yy=2; yy<hi; yy++){
      const xx = Math.round(OFF + (G2/2-2)*Math.sin(yy*.75+ph));
      dot(xx,yy, shadeHex(frost.c2,1.12)); dot(xx+1,yy, frost.c2);
    }
  } else if(frost.style==="carnival"){ /* 彩针狂欢：密撒彩色糖针 */
    const cols = [frost.c2, frost.c3, shadeHex(frost.c1,1.28)];
    for(let yy=2; yy<hi; yy++) for(let xx=2; xx<hi; xx++)
      if(at(xx,yy) && sr()<.17) G(xx,yy,1,1, cols[Math.floor(sr()*3)]);
  } else if(frost.style==="drip"){ /* 半淋流淌：底缘挂下垂坠 */
    for(let xx=2; xx<hi; xx++){
      let bottom = -1;
      for(let yy=hi; yy>=0; yy--) if(at(xx,yy)){ bottom = yy; break; }
      if(bottom>=0 && bottom<hi-1 && sr()<.7){
        const len = 1 + Math.floor(sr()*3);
        for(let k=1;k<=len;k++) G(xx, bottom+k, 1, 1, shadeHex(frost.c1,.78));
      }
    }
  }
}

/* ---------- 状态与存储 ---------- */
const LS_KEY = "starjar.v2";
/* 沙箱环境（如内置预览 iframe 缺 allow-same-origin）访问 localStorage 直接抛
   SecurityError，会让启动流程整个中断 —— 所有存取统一走下面的安全函数，
   不可用时自动降级为「内存模式」：应用照常跑，只是进度不落盘。 */
const LS_OK = (()=>{ try{ localStorage.getItem("__probe"); return true; }catch(e){ return false; } })();
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
let state = null;
function defaultJar(name, themeId, foodId){
  const theme = THEME_MAP[themeId] || THEMES[0];
  foodId = foodId || pick(theme.foods);   /* 招牌食物系统预存，建罐不强制选，每日打卡随机抽一款 */
  return { id:"j"+Date.now().toString(36)+Math.floor(Math.random()*99),
    name, themeId, foodId, created:todayStr(),
    count:0, streak:0, best:0, lastDate:"", todayProgress:0, todayDate:"",
    history:{}, items:[], medals:{}, archives:[] };
}
function defaultState(){
  return { jars:[ defaultJar("我的第一个罐","dessert","donut") ],
    activeJar:0, globalStreak:0, lastGlobalDate:"", seenHelp:false, night:false,
    spriteName:"罐罐", spriteNamed:false, feedChances:0 };
}
function load(){
  try{ const raw = lsGet(LS_KEY); if(raw){ state = JSON.parse(raw);
    normalizeStateJars();
    if(typeof state.night!=="boolean") state.night = false; return; } }catch(e){}
  /* 旧版本（starjar.v1）数据迁移：字段宽容搬移 + 缺省兜底，
     用户累积的罐子和打卡记录绝不因版本升级丢失（v1 原数据保留不删） */
  try{
    const old = JSON.parse(lsGet("starjar.v1") || "null");
    if(old && Array.isArray(old.jars) && old.jars.length){
      const jars = old.jars.map(j=>{
        const nj = Object.assign(defaultJar(j.name||"我的罐", j.themeId||"dessert", j.foodId||"donut"), j);
        nj.items = (Array.isArray(j.items) ? j.items : []).map(it =>
          (it && it.frost) ? it : Object.assign({foodId:nj.foodId, seed:7, special:0}, it, {frost: genFrost(nj)}));
        nj.history = (j.history && typeof j.history==="object") ? j.history : {};
        nj.todayProgress = 0; nj.todayDate = "";   /* 跨版本不恢复半成品进度，明天可重新打卡 */
        return nj;
      });
      state = { jars,
        activeJar: Math.min(old.activeJar||0, jars.length-1),
        globalStreak: old.globalStreak||0, lastGlobalDate: old.lastGlobalDate||"",
        seenHelp: !!old.seenHelp, night:false };
      normalizeStateJars();
      return;
    }
  }catch(e){}
  state = defaultState();
}
/* 罐子数据规范化 + 旧存档「满罐自动封存」迁移：
   补齐 archives / items / medals 缺省；超过 JAR_CAP 的旧罐子静默封存（不播放动画），
   连续天数、勋章、历史全部保留——用户累积的记录绝不因版本升级丢失 */
function normalizeStateJars(){
  if(!state || !Array.isArray(state.jars)) return;
  state.jars.forEach(j=>{
    if(!j) return;
    if(!Array.isArray(j.items)) j.items = [];
    if(!Array.isArray(j.archives)) j.archives = [];
    if(!j.medals || typeof j.medals!=="object") j.medals = {};
    if(j.items.length >= JAR_CAP){
      j.archives.push({ id:"a"+j.id+"-"+j.archives.length, sealedAt:j.lastDate||todayStr(),
        count:j.items.length, items:j.items.slice(-JAR_CAP), themeId:j.themeId });
      j.items = [];
    }
  });
}
let SAVE_DISABLED = false;   /* 预览/演示模式下禁止写盘，避免覆盖真实存档 */
function save(){ if(SAVE_DISABLED) return; lsSet(LS_KEY, JSON.stringify(state)); }
function activeJar(){ return state.jars[state.activeJar] || state.jars[0]; }
/* ============================================================
   音效 —— 8-bit chiptune，WebAudio 现场合成，零音频文件
   ============================================================ */
let AC = null;
function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=null; } }
  if(AC && AC.state==="suspended") AC.resume(); return AC; }
function beep(freq, dur, type="square", vol=.12, when=0){
  const c = ac(); if(!c) return;
  const t = c.currentTime + when;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(.0001, t+dur);
  o.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t+dur+.02);
}
function slide(f1, f2, dur, type="square", vol=.1){
  const c = ac(); if(!c) return;
  const t = c.currentTime;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f1,t); o.frequency.linearRampToValueAtTime(f2, t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001, t+dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+.02);
}
const SFX = {
  pop(){ beep(520,.07,"square",.1); beep(780,.09,"square",.09,.06); },
  squish(){ slide(300,160,.14,"triangle",.14); },
  coat(){ slide(440,660,.5,"sine",.07); beep(880,.05,"square",.04,.45); },
  sprinkle(){ for(let i=0;i<5;i++) beep(1200+rint(0,500), .04, "square", .045, i*.05); },
  jar(){ beep(140,.16,"triangle",.2); beep(90,.22,"sine",.16,.03); },
  sparkle(){ [880,1108,1318,1760].forEach((f,i)=>beep(f,.12,"sine",.08,i*.07)); },
  bad(){ beep(200,.1,"sawtooth",.08); beep(160,.12,"sawtooth",.07,.1); },
  cheer(){ [523,659,784,1046].forEach((f,i)=>beep(f,.14,"square",.1,i*.09)); },
  pat(){ beep(660,.06,"sine",.1); beep(520,.08,"sine",.09,.07); },
  step(){ beep(320,.03,"square",.03); },

/* ============================================================
   画布舞台 —— 逻辑分辨率 800x600，居中缩放适配
   像素风核心：场景先画到 400x300 低分辨率离屏，再 nearest
   放大到主画布 —— 颗粒感由此而来，所有绘制用逻辑坐标不变。
   ============================================================ */
const W = 800, H = 600;
const PIX = 2;                                /* 1 个像素块 = 2 逻辑单位（比初版更精细，颗粒更细） */
const stage = $("#stage");
const ctx = stage.getContext ? stage.getContext("2d") : null;
const spriteLayer = $("#sprite-layer");
const slctx = spriteLayer && spriteLayer.getContext ? spriteLayer.getContext("2d") : null;
const sctx = ctx;                              /* 场景直接画主画布。旧版的「离屏缩小→非整数倍放大」
                                                  两段采样是画面发糊的根源，彻底移除。 */
/* 全局整数对齐变换：所有 fillRect 先对齐 PIX 网格，再按 K 取整到物理像素 ——
   无论窗口多大都落在整数像素上，硬边清晰，绝不半像素插值。 */
let CUR = { K:1, VX:0, VY:0 };
function setT(k, vx, vy){ CUR = { K:k, VX:vx, VY:vy }; }
let view = { scale:1, ox:0, oy:0 };
function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const r = stage.getBoundingClientRect();
  const cw = r.width || window.innerWidth || W;
  stage.width = Math.max(2, Math.round(cw * dpr));
  stage.height = Math.max(2, Math.round(stage.width * H / W));
  /* 精灵顶层画布与主画布同尺寸、同位置 → 两者精确重叠 */
  if(spriteLayer){ spriteLayer.width = stage.width; spriteLayer.height = stage.height; }
  if(slctx) slctx.imageSmoothingEnabled = false;
  setT(stage.width / W, 0, 0);
  bgKey = ""; jarKey = "";                     /* 缓存按新尺寸重建 */
  layoutOverlays();
}
window.addEventListener("resize", resize);

function avoidProps(x, y){
  if(y < 400) return { x, y };                    // 空中/罐口高度不参与规避
  const M = 26;                                   // 精灵半宽余量
  const boxes = PROP_BOXES.slice();

  if(jar && jar.archives) for(const g of giftSlots(jar))
    boxes.push({ x:g.x-26*g.scale, y:g.baseY-54*g.scale, w:52*g.scale, h:56*g.scale });
  for(const b of boxes){
    if(x > b.x-M && x < b.x+b.w+M && y > b.y-24 && y < b.y+b.h+24){
      const dl = x-(b.x-M), dr = (b.x+b.w+M)-x;
      x += (dl < dr ? -dl : dr);                  // 平移到较近的一侧之外
    }
  }
  return { x, y };
}

/* ============================================================
   像素绘制：把 16x16 网格的三件套画到画布上
   maskFn(gx,gy)：可选格子级遮罩（糖霜绕圈 Reveal 用，硬边无矢量路径）
   ============================================================ */
function paintFood(c, foodId, cx, cy, cell, stageLv, special, frost, maskFn){
  const f = FOODS[foodId]; if(!f) return;
  const ov = f.cx || 8;                                   /* 食物本地网格的中心 */
  /* 格子 → 整数物理像素（端点差法：相邻格子无缝无重叠，永不半像素） */
  const gx0 = v => Math.round(snap(v)*CUR.K) + CUR.VX;
  const gy0 = v => Math.round(snap(v)*CUR.K) + CUR.VY;
  const G = (gx,gy,gw,gh,color) => {
    c.fillStyle = color;
    if(maskFn){
      const x0=Math.floor(gx), x1=Math.ceil(gx+gw), y0=Math.floor(gy), y1=Math.ceil(gy+gh);
      const cs = Math.max(PIX, snap(cell)||PIX);
      for(let yy=y0; yy<y1; yy++) for(let xx=x0; xx<x1; xx++){
        if(!maskFn(xx,yy)) continue;
        const px = cx + (xx-ov)*cell, py = cy + (yy-ov)*cell;
        c.fillRect(gx0(px), gy0(py), Math.max(1, gx0(px+cs)-gx0(px)), Math.max(1, gy0(py+cs)-gy0(py)));
      }
      return;
    }
    const px = cx + (gx-ov)*cell, py = cy + (gy-ov)*cell;
    const pw = Math.max(PIX, snap(gw*cell)||PIX), ph = Math.max(PIX, snap(gh*cell)||PIX);
    c.fillRect(gx0(px), gy0(py), Math.max(1, gx0(px+pw)-gx0(px)), Math.max(1, gy0(py+ph)-gy0(py)));
  };
  if(stageLv>=1) f.base(G);
  if(stageLv>=2){
    if(special && special%10===0) rainbowCoat(G, foodId); /* 第 10 枚：彩虹限定款 */
    else if(frost) paintCoatVariant(G, foodId, frost);    /* 混色糖霜配方 */
    else f.coat(G);
  }
  if(stageLv>=3) f.top(G);
}
/* 把任意食物渲染成「清爽小图标」到指定 canvas（用于三步打卡按钮）。
   做法：先在 grid×PIX 分辨率的离屏画布上用 paintFood 以 1:1 像素绘制，
   再等比缩放进目标 canvas（最近邻硬边）—— 与网格分辨率无关，网格再大也不会越界变空。 */
function drawFoodIcon(canvas, foodId, stageLv, special, frost){
  const f = FOODS[foodId]; if(!f) return;
  const off = f.grid * PIX;
  if(!drawFoodIcon._off || drawFoodIcon._off.width !== off){
    drawFoodIcon._off = document.createElement("canvas");
    drawFoodIcon._off.width = off; drawFoodIcon._off.height = off;
  }
  const oc = drawFoodIcon._off.getContext ? drawFoodIcon._off.getContext("2d") : null;
  if(!oc) return;
  oc.clearRect(0,0,off,off); oc.imageSmoothingEnabled = false;
  const oldCUR = CUR; CUR = { K:1, VX:0, VY:0 };        /* 离屏用单位变换，避免主画布 CUR 污染 */
  paintFood(oc, foodId, off/2, off/2, PIX, stageLv, special, frost);
  CUR = oldCUR;
  const c = canvas.getContext ? canvas.getContext("2d") : null; if(!c) return;
  c.clearRect(0,0,canvas.width,canvas.height); c.imageSmoothingEnabled = false;
  const s = Math.min(canvas.width, canvas.height) - 6;
  c.drawImage(drawFoodIcon._off, (canvas.width-s)/2, (canvas.height-s)/2, s, s);
}
/* 糖霜绕圈 Reveal：从顶部起顺时针扫过的扇形遮罩（格子中心判定，支持不同分辨率） */
function wedgeMask(q, off=8, rad=10){
  const swept = q*Math.PI*2, r2 = rad*rad;
  return (gx,gy)=>{
    const dx = gx+.5-off, dy = gy+.5-off;
    if(dx*dx+dy*dy > r2) return false;
    let a = Math.atan2(dy,dx) + Math.PI/2;
    if(a < 0) a += Math.PI*2;
    return a <= swept + 1e-9;
  };
}
/* 种子化随机（罐内堆叠位置稳定） */
function seedRand(seed){ let s = seed*9301+49297; return ()=>{ s=(s*9301+49297)%233280; return s/233280; }; }

/* ============================================================
   场景静态层（墙/地板/装饰）—— 预渲染到离屏画布
   ============================================================ */
function drawRoom(c, theme, night){
  const FLOOR_Y = 500;
  const wall1 = night ? "#3A3357" : "#FFF6E3";
  const wall2 = night ? "#322B4C" : "#FBEFD6";
  const wood1 = night ? "#6E5436" : "#C8956A";
  const wood2 = night ? "#5A4429" : "#B57F55";
  const wood3 = night ? "#8A6E4A" : "#DECBA8";
  /* 墙：暖奶油底 + 细密点阵（夜晚切换为暖紫暗调） */
  P(c, 0, 0, W, FLOOR_Y, wall1);
  for(let gy=0; gy<FLOOR_Y; gy+=4){
    for(let gx=((gy/4)%2 ? 0 : 2); gx<W; gx+=8) P(c, gx, gy, 4, 4, wall2);
  }
  /* 地板：暖木地板（夜晚更暗） */
  P(c, 0, FLOOR_Y, W, 26, wood1);
  P(c, 0, FLOOR_Y+26, W, 7, wood2);
  for(let x=0; x<W; x+=60) P(c, x, FLOOR_Y, 5, 33, wood3);
  drawWindow(c, night);
  drawFramePicture(c, theme);
  drawFloorPlant(c, 150, FLOOR_Y);
  drawThemeDecor(c, theme, night);
  if(night){
    /* 夜色氛围：整屋压一层暖蓝暗调（在罐子之前画，罐子仍明亮治愈） */
    P(c, 0, 0, W, H, "rgba(28,26,64,.34)");
  }
}
function drawWindow(c, night){
  const sx=52, sy=82, sw=116, sh=110;
  if(night){
    /* 夜空：深蓝底 + 几颗星 + 月牙 */
    P(c, sx, sy, sw, sh, "#27314F");
    const stars=[[70,108],[92,128],[120,104],[140,142],[80,152],[112,160],[150,118],[64,140]];
    for(const [x,y] of stars) P(c, x, y, 3, 3, "#FDF6C8");
    pCircle(c, 132, 112, 16, "#FBEFB0"); pCircle(c, 138, 108, 16, "#27314F"); /* 月牙 */
    pCircle(c, 126, 110, 3, "#E9DD92");
  } else {
    /* 天空：蓝底 + 细 dot + 方块白云（初版 demo 的窗） */
    P(c, sx, sy, sw, sh, "#BEE3F5");
    for(let gy=84; gy<188; gy+=8){
      const start = 54 + ((gy/8|0)%2 ? 4:0);
      for(let gx=start; gx<166; gx+=8) P(c, gx, gy, 4, 4, "#D6EEF9");
    }
    P(c, 72, 122, 34, 8, "#FFFFFF");
    P(c, 80, 116, 20, 6, "#FFFFFF");
    P(c, 86, 130, 24, 8, "#FFFFFF");
    P(c, 138, 100, 10, 3, "#FFD66B"); P(c, 141.5, 96.5, 3, 10, "#FFD66B"); /* 窗内小星 */
  }
  /* 窗框 + 十字格（深木色） */
  P(c, sx, sy, sw, 6, "#96613C"); P(c, sx, sy+sh-6, sw, 6, "#96613C");
  P(c, sx, sy, 6, sh, "#96613C"); P(c, sx+sw-6, sy, 6, sh, "#96613C");
  P(c, sx+sw/2-2, sy, 4, sh, "#96613C"); P(c, sx, sy+sh/2-2, sw, 4, "#96613C");
}

const DECOR_STARS = [[210,40],[276,66],[380,34],[524,62],[560,38],[640,74],[700,46],
  [240,112],[520,106],[660,118],[330,142],[150,46]];
const DECOR_STAR_COLS = ["#FFD66B","#C3AEF2","#FFA9C9","#8FDCC2","#93C9F7","#C3AEF2","#FFD66B",
  "#C3AEF2","#FFA9C9","#93C9F7","#FFD66B","#C3AEF2"];
/* 悬挂小星星 / 小爱心（轻微摇摆 + 暖光晕；夜晚更亮）
   位置避让荣誉柜（柜体 x 294–506）：左边爱心挂窗右上方、右边星星挂画框上方，都完整可见 */
const DECOR_CHARMS = [
  {x:180, phase:0.0, type:"heart", col:"#FFA9C9"},
  {x:620, phase:1.7, type:"star",  col:"#FFD66B"},
];
const GARLAND = []; for(let x=110; x<=710; x+=75) GARLAND.push(x);
function drawDecorOverlay(c, night, t){
  drawGarland(c, t);                          /* 顶部淡紫小花环 */
  /* 漂浮闪烁小星星（避开左栏与罐子区域），含淡紫色 */
  for(let i=0;i<DECOR_STARS.length;i++){
    const x=DECOR_STARS[i][0], y=DECOR_STARS[i][1];
    const big = (Math.sin(t*2.4 + i*0.9) > -0.2);   /* 利落 twinkle */
    const col = DECOR_STAR_COLS[i];
    P(c, x, y, 2, 2, col);
    if(big){ P(c, x-3, y, 1, 2, col); P(c, x+3, y, 1, 2, col); P(c, x, y-3, 2, 1, col); P(c, x, y+3, 2, 1, col); }
  }
  /* 悬挂小星星 / 小爱心（轻微摇摆 + 暖光晕；夜晚更亮） */
  for(const C of DECOR_CHARMS){
    drawCharm(c, C.x + Math.sin(t*0.9 + C.phase)*4, 18, C, night);
  }
  if(night){
    /* 夜萤火虫：几只缓缓飘 */
    for(let i=0;i<5;i++){
      const fx = 210 + i*110 + Math.sin(t*0.6 + i)*16;
      const fy = 360 + Math.cos(t*0.5 + i*1.3)*26;
      const on = (Math.sin(t*3 + i*2) > 0) ? 1 : 0.3;
      P(c, Math.round(fx), Math.round(fy), 2, 2, "rgba(255,236,150,"+on+")");
    }
  }
}

/* 马卡龙：两片壳 + 中间奶油层 */
function pMacaron(c, cx, cy, R, m){
  pEllipse(c, cx, cy-0.30*R, 1.12*R, 0.55*R, m.color);
  P(c, cx-1.06*R, cy-0.06*R, 2.12*R, 0.30*R, m.accent);
  pEllipse(c, cx, cy+0.32*R, 1.12*R, 0.55*R, m.color);
  pEllipse(c, cx, cy+0.48*R, 0.92*R, 0.28*R, _mix(m.color,"#000000",.12));
}
/* 纸杯蛋糕：奶油山 + 纸杯 + 樱桃（整体控制在 ±1.05R 内，小柜格不溢出） */
function pCupcake(c, cx, cy, R, m){
  const top = cy+0.26*R, bot = cy+0.94*R, steps = Math.max(1, Math.round((bot-top)/PIX));
  for(let i=0;i<=steps;i++){ const t=i/steps, w=0.62*R*(1-t*0.30); P(c, cx-w, top+(bot-top)*t, 2*w, PIX, "#FAC775"); }
  P(c, cx-0.60*R, top, 1.20*R, 0.16*R, "#EF9F27");
  pCircle(c, cx, cy-0.16*R, 1.00*R, m.color);
  pCircle(c, cx-0.42*R, cy-0.40*R, 0.52*R, m.color);
  pCircle(c, cx+0.40*R, cy-0.38*R, 0.50*R, m.color);
  pCircle(c, cx, cy-0.68*R, 0.42*R, m.color);
  pCircle(c, cx, cy-0.86*R, 0.22*R, m.accent);
}
/* 棒棒糖：圆糖 + 螺旋 + 小棍（短棍，整体控制在 ±1.15R 内） */
function pLollipop(c, cx, cy, R, m){
  P(c, cx-0.07*R, cy+0.18*R, 0.14*R, 0.62*R, "#C8956A");
  pCircle(c, cx, cy-0.20*R, 0.92*R, m.color);

}

/* 冰淇淋：蛋筒 + 双球 */

  for(let i=0;i<=steps;i++){ const t=i/steps, w=0.52*R*(1-t*0.34); P(c, cx-w, top+(bot-top)*t, 2*w, PIX, "#FAC775"); }

/* 单枚勋章：逻辑坐标 (cx,cy) 绘制；scale 放大用（成就弹窗大图） */
function drawMedal(c, cx, cy, m, t, night, scale){
  const sc = scale||1, R = 20*sc;
  /* 暖光晕（小尺寸柜格里不画，避免溢出格子） */
  if(sc >= 1){
    const glow = night ? 0.20 : 0.10;
    for(let r=R+12*sc; r>=R; r-=4*sc) pCircle(c, cx, cy, r, "rgba(255,225,170,"+(glow*(1-(R+12*sc-r)/(12*sc))).toFixed(3)+")");
  }
  if(m.shape==="macaron")      pMacaron(c, cx, cy, R, m);
  else if(m.shape==="cupcake") pCupcake(c, cx, cy, R, m);
  else if(m.shape==="lollipop")pLollipop(c, cx, cy, R, m);
  else if(m.shape==="donut")   pDonut(c, cx, cy, R, m);
  else if(m.shape==="icecream")pIcecream(c, cx, cy, R, m);
  else if(m.shape==="cake")    pCake(c, cx, cy, R, m);
}

/* 花环弧线：以画面中心 410 为最低点、两端齐平的对称轻微下垂（不再歪斜） */
const garlandY = x => { const f = (x - 410) / 300; return 12 + 16 * (1 - f*f); };
/* 顶部淡紫小花环：一串小五瓣花，沿对称下垂弧均匀坐着（绳穿花心，随风轻晃） */
function drawGarland(c, t){
  const Y = x => garlandY(x) + Math.round(Math.sin(t*1.2 + x*0.02)*1.2);  /* 极轻微起伏，不破坏对称 */
  /* 主绳：连接各节点（同在一条对称抛物线上 → 平滑下垂弧） */
  for(let i=0;i<GARLAND.length-1;i++){
    pLine(c, GARLAND[i], Y(GARLAND[i]), GARLAND[i+1], Y(GARLAND[i+1]), "#B79AD0", 2);
  }
  /* 花朵：正中坐在绳上（绳穿花心），随风轻轻晃 */
  for(let i=0;i<GARLAND.length;i++){
    const x=GARLAND[i], y=Y(x);
    P(c, x, y, 3, 3, "#C3AEF2");
    P(c, x-3, y, 2, 2, "#C3AEF2"); P(c, x+3, y, 2, 2, "#C3AEF2");
    P(c, x, y-3, 2, 2, "#C3AEF2"); P(c, x, y+3, 2, 2, "#C3AEF2");
    P(c, x-1, y-1, 2, 2, "#FFD66B");   /* 花心 */
  }
}
/* 悬挂小星星 / 小爱心：淡紫吊绳 + 暖光晕 + 轻微摇摆 */
function drawCharm(c, x, topY, C, night){
  const glow = night ? 0.26 : 0.12;
  const cy = topY + 40;
  for(let r=22; r>=10; r-=6) pCircle(c, x, cy, r, "rgba(255,225,170,"+(glow*(1-(22-r)/22)).toFixed(3)+")");
  P(c, x, topY, 2, 22, "#B79AD0");                 /* 吊绳（淡紫） */
  if(C.type==="heart"){
    pHeart(c, x, cy, 11, C.col); pHeart(c, x, cy-1, 5, "#FFFFFF");
  } else {
    pStar(c, x, cy, 13, C.col); pStar(c, x, cy, 6, "#FFF3C9");
  }
}

/* ============ 像素绘制原语（对齐 PIX 网格 + 整数物理像素，绝不做半像素插值） ============ */
const snap = v => Math.round(v/PIX)*PIX;
function P(c,x,y,w,h,col){
  const x0 = Math.round(snap(x)*CUR.K) + CUR.VX, y0 = Math.round(snap(y)*CUR.K) + CUR.VY;
  const x1 = Math.round(snap(x+w)*CUR.K) + CUR.VX, y1 = Math.round(snap(y+h)*CUR.K) + CUR.VY;
  c.fillStyle = col;
  c.fillRect(x0, y0, Math.max(1, x1-x0), Math.max(1, y1-y0));
}
function pCircle(c,cx,cy,r,col){
  const ri = Math.max(PIX, Math.round(r));
  for(let dy=-ri; dy<=ri; dy+=PIX){
    const dx = Math.floor(Math.sqrt(Math.max(0, ri*ri - dy*dy))/PIX)*PIX;
    P(c, cx-dx, cy+dy, dx*2+PIX, PIX, col);
  }
}
function pEllipse(c,cx,cy,rx,ry,col){
  const ryi = Math.max(PIX, Math.round(ry)), rxi = Math.max(PIX, Math.round(rx));
  for(let dy=-ryi; dy<=ryi; dy+=PIX){
    const dx = Math.floor(Math.sqrt(Math.max(0, 1-(dy/ryi)*(dy/ryi)))*rxi/PIX)*PIX;
    P(c, cx-dx, cy+dy, dx*2+PIX, PIX, col);
  }
}
function pRing(c,cx,cy,r,col){
  const ri = Math.max(PIX, Math.round(r));
  for(let dy=-ri; dy<=ri; dy+=PIX){
    const dx = Math.floor(Math.sqrt(Math.max(0, ri*ri - dy*dy))/PIX)*PIX;
    if(dx>0){ P(c, cx-dx, cy+dy, PIX, PIX, col); P(c, cx+dx-PIX, cy+dy, PIX, PIX, col); }
    else P(c, cx-PIX/2, cy+dy, PIX, PIX, col);
  }
}
function pRingEllipse(c,cx,cy,rx,ry,col){
  const ryi = Math.max(PIX, Math.round(ry)), rxi = Math.max(PIX, Math.round(rx));
  for(let dy=-ryi; dy<=ryi; dy+=PIX){
    const dx = Math.round(Math.sqrt(Math.max(0, 1-(dy/ryi)*(dy/ryi)))*rxi/PIX)*PIX;
    if(dx>0){ P(c, cx-dx, cy+dy, PIX, PIX, col); P(c, cx+dx-PIX, cy+dy, PIX, PIX, col); }
    else P(c, cx-PIX/2, cy+dy, PIX, PIX, col);
  }
}
function _rrInset(y0,y1,yy,ri){
  if(yy < y0+ri){ const dy = y0+ri-yy-PIX/2; return ri - Math.floor(Math.sqrt(Math.max(0,ri*ri-dy*dy))/PIX)*PIX; }
  if(yy >= y1-ri){ const dy = yy-(y1-ri)-PIX/2; return ri - Math.floor(Math.sqrt(Math.max(0,ri*ri-dy*dy))/PIX)*PIX; }
  return 0;
}
function pRoundRect(c,x,y,w,h,r,col){
  const x0=snap(x), y0=snap(y), x1=snap(x+w), y1=snap(y+h);
  if(x1<=x0||y1<=y0) return;
  const ri = Math.min(snap(r)||0, (x1-x0)/2, (y1-y0)/2);
  for(let yy=y0; yy<y1; yy+=PIX){
    const inset = Math.max(0, Math.min(_rrInset(y0,y1,yy,ri), (x1-x0)/2-PIX));
    P(c, x0+inset, yy, x1-x0-inset*2, PIX, col);
  }
}
function pRoundRectStroke(c,x,y,w,h,r,col,th=PIX){
  const x0=snap(x), y0=snap(y), x1=snap(x+w), y1=snap(y+h);
  if(x1<=x0||y1<=y0) return;
  const ri = Math.min(snap(r)||0, (x1-x0)/2, (y1-y0)/2);
  for(let yy=y0; yy<y1; yy+=PIX){
    const inset = Math.max(0, Math.min(_rrInset(y0,y1,yy,ri), (x1-x0)/2-PIX));
    if(yy<y0+th*2 || yy>=y1-th*2) P(c, x0+inset, yy, x1-x0-inset*2, PIX, col);
    else { P(c, x0+inset, yy, th*2, PIX, col); P(c, x1-inset-th*2, yy, th*2, PIX, col); }
  }
}
function pLine(c,x1,y1,x2,y2,col,w=PIX){
  const steps = Math.max(1, Math.ceil(Math.hypot(x2-x1,y2-y1)/PIX));
  for(let i=0;i<=steps;i++){ const t=i/steps; P(c, lerp(x1,x2,t), lerp(y1,y2,t), w, w, col); }
}
function pVBand(c,x,y,w,h,stops){ /* 垂直色带：替代 linearGradient */
  const y0=snap(y), y1=snap(y+h), total=Math.max(1,y1-y0);
  for(let yy=y0; yy<y1; yy+=PIX){
    const t=(yy-y0)/total;
    let col=stops[stops.length-1][1];
    for(const s of stops){ if(t<=s[0]){ col=s[1]; break; } }
    P(c,x,yy,w,PIX,col);
  }
}
function pStar(c,cx,cy,r,col){ /* 四角星（菱形，复古游戏语汇） */
  const ri = Math.max(PIX, Math.round(r/PIX)*PIX);
  for(let dy=-ri; dy<=ri; dy+=PIX){
    const half = Math.round((1-Math.abs(dy)/ri)*ri/PIX)*PIX;
    if(half<=0) continue;
    P(c, cx-half, cy+dy, half*2, PIX, col);
  }
}
function pHeart(c,cx,cy,r,col){
  const ri = Math.max(PIX, Math.round(r));
  for(let dy=-ri; dy<=ri; dy+=PIX){
    const ny = dy/ri;
    const half = ny<0 ? Math.sqrt(Math.max(0,1-ny*ny*1.8))*ri*.95
                      : Math.sqrt(Math.max(0,1-ny*ny))*ri*(1-ny*.6);
    const hs = Math.round(half/PIX)*PIX;
    if(hs<=0) continue;
    P(c, cx-hs, cy+dy, hs*2, PIX, col);
  }
}
function pSmile(c,cx,cy,w,col,down=1){
  for(let i=0;i<=8;i++){ const t=i/8; P(c, cx-w/2+w*t, cy+Math.sin(t*Math.PI)*w*.28*down, PIX, PIX, col); }
}
function pZzz(c,x,y,s,col){ /* 像素 z 字（3x3 点阵，代替文字） */
  P(c, x, y, 3*s, s, col); P(c, x+s, y+s, s, s, col); P(c, x, y+2*s, 3*s, s, col);
}
/* 像素数字（3x5 点阵，计数器牌用） */
const GLYPH_DIGITS = {
  "0":["111","101","101","101","111"], "1":["110","010","010","010","111"],
  "2":["111","001","111","100","111"], "3":["111","001","111","001","111"],
  "4":["101","101","111","001","001"], "5":["111","100","111","001","111"],
  "6":["111","100","111","101","111"], "7":["111","001","001","010","010"],
  "8":["111","101","111","101","111"], "9":["111","101","111","001","111"],
};
function pDigits(c, str, x, y, cell, col){
  let cx = x;
  for(const ch of str){
    const g = GLYPH_DIGITS[ch];
    if(g){ for(let r=0;r<5;r++) for(let q=0;q<3;q++)
      if(g[r][q]==="1") P(c, cx+q*cell, y+r*cell, cell, cell, col); }
    cx += cell*4;
  }
}
/* 工具：像素星星 & 颜色透明度 */
function drawPixelStar(c,cx,cy,r,col,on){ pStar(c,cx,cy,r,col); }
function hexA(hex,a){ const n=parseInt(hex.slice(1),16); return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`; }
/* ============================================================
   罐子 —— 玻璃罐身 + 罐内堆叠 + 装饰解锁 + 挂绳计数牌
   ============================================================ */
const UNLOCKS = [
  { at:7,   name:"蝴蝶结" }, { at:21,  name:"小围巾" }, { at:30,  name:"星星挂饰" },
  { at:50,  name:"小皇冠" }, { at:100, name:"守护光环" }, { at:365, name:"大奖杯" },
];
function drawJar(c, jar, shake){
  const theme = THEME_MAP[jar.themeId] || THEMES[0];
  const x = JAR.x, y = JAR.y, w = JAR.w, h = JAR.h;
  const sx = shake>0 ? Math.sin(shake*40)*4*(1-shake) : 0;
  c.save(); c.translate(sx, 0);
  /* 罐底软阴影：把罐子放在地板上（不用大光晕抢戏） */
  pEllipse(c, x, y+h+10, w*0.46, 15, "rgba(140,90,43,.20)");
  pEllipse(c, x, y+h+8, w*0.30, 9, "rgba(140,90,43,.16)");
  /* 罐身：浅蓝玻璃（初版 demo 语汇：玻璃底 + 细密 dot 颗粒） */
  pRoundRect(c, x-w/2, y, w, h, 22, "#E6F3F9");
  for(let yy=y+8; yy<y+h-8; yy+=12){
    const rowOff = ((yy-y)/12|0)%2 ? 6 : 0;
    for(let xx=x-w/2+10+rowOff; xx<x+w/2-10; xx+=12) P(c, xx, yy, 4, 4, "#D2E9F2");
  }
  /* 罐内堆叠 */
  drawJarItems(c, jar, x, y+h-14);
  /* 玻璃反光：左粗右细（初版 demo 的高光语汇） */
  P(c, x-w/2+16, y+22, 10, h-66, "rgba(255,255,255,.92)");
  P(c, x-w/2+28, y+30, 4, h-92, "rgba(255,255,255,.55)");
  P(c, x+w/2-26, y+30, 4, h-88, "rgba(255,255,255,.42)");
  /* 罐身描边：墨色粗边（星露谷语汇，罐子从奶油墙里跳出来） */
  pRoundRectStroke(c, x-w/2, y, w, h, 22, "#5C4A3A", 5);
  /* 罐底沿：玻璃线 */
  P(c, x-w/2+12, y+h-12, w-24, 4, "#9DC2D4");
  /* 罐口：浅蓝口沿 + 墨线（初版 demo 的罐口语汇：细薄一圈，宽出罐身少许） */
  pRoundRect(c, x-w/2-9, y-12, w+18, 16, 5, "#9DC2D4");
  P(c, x-w/2-9, y-12, w+18, 4, "#5C4A3A");
  P(c, x-w/2-9, y, w+18, 4, "#5C4A3A");
  P(c, x-w/2+4, y-8, w-8, 3, "rgba(255,255,255,.5)");
  /* 成长装饰 */
  drawJarUnlocks(c, jar, x, y, w, h);
  /* 挂绳计数牌（像素数字，宽度随位数） */
  const cnt = String(Math.min(jar.count, 999));
  const dc = 4, dw = cnt.length*dc*4 - dc, dh = 5*dc;
  const tw = dw + 16, th = dh + 12;
  const tx0 = x + w/2 + 10, ty0 = y + 26;
  pLine(c, x+w/2-10, y+2, tx0+9, ty0, "#96613C", 2);
  pRoundRect(c, tx0, ty0, tw, th, 4, "#FFF6EA");
  pRoundRectStroke(c, tx0, ty0, tw, th, 4, "#5C4A3A", 3);
  pDigits(c, cnt, tx0 + (tw-dw)/2, ty0 + (th-dh)/2, dc, "#5C4A3A");
  c.restore();
}
function drawJarItems(c, jar, cx, baseY){
  const items = jar.items.slice(-JAR_CAP);
  if(!items.length) return;
  /* 档位：≤20 枚大颗；第 21 枚起整罐压缩为小颗。packAnim 播放期间两档参数连续插值
     （每行枚数用小数过渡，旧食物平滑变小、重排无跳变） */
  const lv = packLevel(items.length);
  let A = { target:PACK_LV[0].target, colW:PACK_LV[0].colW, rowH:PACK_LV[0].rowH };
  let perRowF = PACK_LV[0].perRow;
  if(lv===1){
    const e = packAnim ? clamp(packAnim.t/packAnim.dur, 0, 1) : 1;
    const k = e*e*(3-2*e);
    A = { target:PACK_LV[0].target+(PACK_LV[1].target-PACK_LV[0].target)*k,
          colW:  PACK_LV[0].colW  +(PACK_LV[1].colW  -PACK_LV[0].colW)*k,
          rowH:  PACK_LV[0].rowH  +(PACK_LV[1].rowH  -PACK_LV[0].rowH)*k };
    perRowF = PACK_LV[0].perRow + (PACK_LV[1].perRow-PACK_LV[0].perRow)*k;
  }
  items.forEach((it,i)=>{
    const row = Math.floor(i/perRowF), col = i - row*perRowF;
    const sr = seedRand(it.seed||7);
    const drift = (sr()-.5)*16;                 /* 整行漂移：去掉格子感 */
    const ox = (sr()-.5)*18, oy = (sr()-.5)*8;
    const px = clamp(cx + (col-(perRowF-1)/2)*A.colW + drift + ox, cx-68, cx+68);
    const py = baseY - 24 - row*A.rowH + oy;
    paintFood(c, it.foodId, px, py, foodCell(A.target, it.foodId), 3, it.special, it.frost);
  });
}
function drawJarUnlocks(c, jar, x, y, w, h){

  if(jar.count>=7){ /* 蝴蝶结（两瓣椭圆 + 结心） */
    pEllipse(c, x-13, y+34, 9, 8, theme.color);
    pEllipse(c, x+13, y+34, 9, 8, theme.color);
    pCircle(c, x, y+36, 5, theme.dark);
  }
  if(jar.count>=21){ /* 围巾 */
    pRoundRect(c, x-30, y+h-46, 60, 13, 5, "#FFF3D8");
    pRoundRect(c, x+6, y+h-38, 15, 30, 6, "#93C9F7");
  }
  if(jar.count>=30){ /* 星星挂饰 */
    pStar(c, x-34, y+66, 8, "#FFD66B");
    pStar(c, x+34, y+66, 8, "#FFD66B");
  }
  if(jar.count>=50){ /* 小皇冠（像素三角冠） */
    P(c, x-16, y-16, 32, 8, "#FFD66B");
    P(c, x-16, y-30, 8, 14, "#FFD66B");
    P(c, x-8, y-24, 8, 8, "#FFD66B");
    P(c, x, y-32, 8, 16, "#FFD66B");
    P(c, x+8, y-24, 8, 8, "#FFD66B");
    P(c, x+16, y-30, 8, 14, "#FFD66B");
    pCircle(c, x, y-19, 3, "#FF6FA5");
  }
  if(jar.count>=100){ /* 守护光环（像素椭圆环） */
    pRingEllipse(c, x, y-42, 40, 12, "rgba(255,214,107,.85)");
  }
  if(jar.count>=365){ /* 大奖杯 */
    P(c, x-11, y-30, 22, 16, "#FFD66B");
    P(c, x-7, y-14, 14, 4, "#E0A93E");
    P(c, x-3, y-10, 6, 7, "#FFD66B");
    P(c, x-8, y-3, 16, 4, "#FFD66B");
  }
}

/* ============================================================
   满罐封存 · 礼品罐 —— 罐内装满 JAR_CAP（50）枚后，整罐扎上礼品缎带，
   缩小成和盆栽差不多大的小罐，存放在大罐两侧地面上；同一目标续用
   （连续天数 / 勋章 / 历史全保留，只换新容器）
   ============================================================ */
let sealAnim = null;        // { t, dur, jarId, arch, slot } 封存演出（真罐→缎带→缩小滑走）
let giftHits = [];          // 本帧已绘制礼品罐的命中区（逻辑坐标），供点击检测
/* 地面槽位：大罐左侧（罐与盆栽之间）2 列 ×4 行 + 右侧（罐与摆件之间）1 列 ×4 行，共 12 槽；
   行越靠后 baseY 越高（视觉进深）、scale 递减；超出容量只展示最新的 12 个 */
const GIFT_SLOTS = (()=>{ const s=[];

  const destH = Math.round(SPR_LOGICAL * (SPR_BB.h/SPR_BB.w) * k);
  const bx = Math.round((sxL - SPR_LOGICAL/2) * k);
  const by = Math.round(syL * k) - destH;
  /* 夜晚暖光晕：奶油身体在暗色房间里（尤其贴着明亮罐口时）容易融掉下半身剪影，
     用与夜晚挂饰同款的同心圆低透明暖光晕托住整个轮廓（画在身体后面，原型分毫不动）。
     注意 pCircle/P 系列原语接收「逻辑坐标」，这里必须用 sxL/syL，不能用已乘 K 的 bx/by/destW */
  if(state.night){
    const hcy = syL - SPR_LOGICAL*0.5;                      /* 身体中心（逻辑坐标） */
    const HALO_A = [0.04, 0.06, 0.09];                      /* 外→内三层，柔和不抢戏 */
    for(let r=3; r>=1; r--){
      pCircle(c, sxL, hcy, SPR_LOGICAL*0.30*r, "rgba(255,236,180,"+HALO_A[3-r]+")");
    }
  }
  /* 脚下软阴影（紧凑收拢：太宽的半透明椭圆压在点阵墙上会花成一排碎色块） */
  pEllipse(c, sxL, s.y + 2, SPR_LOGICAL*0.26, SPR_LOGICAL*0.075, "rgba(120,90,60,.18)");
  /* 基础造型：永远 demo 精确（睁眼 / 眨眼由 blinkT 决定） */
  c.drawImage((s.blinkT < .12) ? SPR_IMG.blink : SPR_IMG.open, bx, by, destW, destH);
  /* 状态表情：只在 demo 脸部上叠加，身体造型不变 —— 忠实「一模一样」 */
  const em = s.emote;
  if(em==="sleep"){
    pZzz(c, sxL + SPR_LOGICAL*0.22, by + destH*0.30, SPR_LOGICAL*0.045, "#A08D80");
    pZzz(c, sxL + SPR_LOGICAL*0.32, by + destH*0.18, SPR_LOGICAL*0.07, "#A08D80");
  }
  const isFace = (em==="love"||em==="cheer"||em==="expect"||em==="happy"||em==="shake"
                  ||em==="wink"||em==="shy"||em==="surprised"||em==="eat");
  if(isFace){
    /* 擦除 demo 眼睛区域（cream 还原身体），再画表情眼。
       区域收紧到双眼所在列（demo 网格 x78-85，fillRect 右开），不碰两侧腮红(x76-77 / x86-87) */
    const ex0 = bx + (3/SPR_BB.w)*destW, ex1 = bx + (11/SPR_BB.w)*destW;
    const ey0 = by + (4/SPR_BB.h)*destH, ey1 = by + (9/SPR_BB.h)*destH;
    c.fillStyle = _SC.cream; c.fillRect(ex0, ey0, ex1-ex0, ey1-ey0);
    const EX = SPR_LOGICAL*0.25, EY = SPR_LOGICAL*0.46, R4 = SPR_LOGICAL*0.075;
    if(em==="love"){
      pHeart(c, sxL - EX, syL - EY, R4, _SC.ink);
      pHeart(c, sxL + EX, syL - EY, R4, _SC.ink);
    } else if(em==="cheer"){
      pStar(c, sxL - EX, syL - EY, R4, _SC.ink);
      pStar(c, sxL + EX, syL - EY, R4, _SC.ink);
    } else if(em==="expect"){
      pCircle(c, sxL - EX, syL - EY, R4, "#FFFFFF"); pRing(c, sxL - EX, syL - EY, R4, _SC.ink);
      pCircle(c, sxL + EX, syL - EY, R4, "#FFFFFF"); pRing(c, sxL + EX, syL - EY, R4, _SC.ink);
    } else if(em==="happy"){
      pSmile(c, sxL - EX, syL - EY, R4*1.1, _SC.ink, 1);
      pSmile(c, sxL + EX, syL - EY, R4*1.1, _SC.ink, 1);
    } else if(em==="wink"){
      /* 左眼睁开、右眼俏皮一眨（闭眼短横），嘴角上扬 —— 卖萌 */
      P(c, sxL - EX - R4, syL - EY - R4, R4*2, R4*2, _SC.ink);          /* 左眼：睁开方眼 */
      P(c, sxL + EX - R4, syL - EY - R4*0.2, R4*2, Math.max(PIX,R4*0.9), _SC.ink); /* 右眼：闭眼短横 */
      pSmile(c, sxL, syL - SPR_LOGICAL*0.31, SPR_LOGICAL*0.07, _SC.ink, 1);
    } else if(em==="shy"){
      /* 弯弯笑眼 + 加深腮红（害羞脸红） */
      pSmile(c, sxL - EX, syL - EY, R4*1.1, _SC.ink, 1);
      pSmile(c, sxL + EX, syL - EY, R4*1.1, _SC.ink, 1);
      pCircle(c, sxL - EX - R4*0.4, syL - EY + R4*1.2, R4*1.05, _SC.blush);
      pCircle(c, sxL + EX + R4*0.4, syL - EY + R4*1.2, R4*1.05, _SC.blush);
      pSmile(c, sxL, syL - SPR_LOGICAL*0.30, SPR_LOGICAL*0.06, _SC.ink, 1);
    } else if(em==="surprised"){
      /* 圆睁大眼 + 小 O 嘴（惊讶） */
      pCircle(c, sxL - EX, syL - EY, R4*1.15, _SC.ink);
      pCircle(c, sxL + EX, syL - EY, R4*1.15, _SC.ink);
      pCircle(c, sxL, syL - SPR_LOGICAL*0.26, R4*0.8, _SC.ink);
    } else if(em==="eat"){
      /* 开心吃吃：弯眼微笑 + 嘴边小甜甜圈，配合咀嚼小颠（chew 见 syL） */
      pSmile(c, sxL - EX, syL - EY, R4*1.1, _SC.ink, 1);
      pSmile(c, sxL + EX, syL - EY, R4*1.1, _SC.ink, 1);
      pSmile(c, sxL, syL - SPR_LOGICAL*0.30, SPR_LOGICAL*0.06, _SC.ink, 1);
      const fx = sxL + SPR_LOGICAL*0.22, fy = syL - SPR_LOGICAL*0.16, fr = SPR_LOGICAL*0.11;
      pRing(c, fx, fy, fr, "#C9772E"); pCircle(c, fx, fy, fr*0.55, "#FFE3A1");
      P(c, fx-fr*0.35, fy-fr*0.35, 2,2, "#FF6FA5"); P(c, fx+fr*0.25, fy-fr*0.10, 2,2, "#7FD8F0"); P(c, fx-fr*0.10, fy+fr*0.32, 2,2, "#7FB069");
    } else { /* shake 劝退：撇撇眼 + 撇嘴 */
      pSmile(c, sxL - EX, syL - EY, R4*1.1, _SC.ink, -1);
      pSmile(c, sxL + EX, syL - EY, R4*1.1, _SC.ink, -1);
      pSmile(c, sxL, syL - SPR_LOGICAL*0.31, SPR_LOGICAL*0.07, _SC.ink, -1);
    }
  }
}
function spriteGoto(x, y, speed=140){ const p=avoidProps(x,y); sprite.tx=p.x; sprite.ty=p.y; sprite.speed=speed; sprite.state="goto"; }
function spriteRoam(){ sprite.state="roam"; sprite.restT = rnd(.8, 2.2); }
function updateSprite(dt){
  const s = sprite;
  s.blinkT -= dt; if(s.blinkT < 0) s.blinkT = rnd(2,4.5);   /* 眼睛自然眨动（与表情无关，保持活物感） */
  if(s.hopT>0) s.hopT -= dt;
  if(s.emoteT>0) s.emoteT -= dt;                            /* 表情冷却计时 */
  if(s.loveT>0){                                            /* 被摸头后的 love 表情：短暂停留后自动还原 */
    s.loveT -= dt;
    if(s.loveT<=0){ if(s.emote==="love") s.emote = "blink"; s.emoteT = Math.max(s.emoteT, rnd(8,14)); }
  }
  if(s.eatT>0){                                             /* 喂食后的 eat 表情：吃完自动还原 */
    s.eatT -= dt;
    if(s.eatT<=0){ if(s.emote==="eat") s.emote = "blink"; s.emoteT = Math.max(s.emoteT, rnd(8,14)); }
  }
  if(s.shakeT>0){ s.shakeT -= dt; if(s.shakeT<=0) s.emote = s.state==="goto"?"expect":"blink"; }
  if(s.emote==="sleep") s.zzz = (s.zzz + dt) % 2;
  /* 移动 */
  const dx = s.tx - s.x, dy = s.ty - s.y;
  const dist = Math.hypot(dx, dy);
  if(dist > 3){
    s.state = "walk";
    s.x += dx/dist * Math.min(s.speed||120, dist/dt) * dt;
    s.y += dy/dist * Math.min(s.speed||120, dist/dt) * dt;
    s.walkT += dt;
    if(s.walkT > .18){ s.walkT = 0; s.frame = s.frame?0:1; if(Math.random()<.3) SFX.step(); }
  } else if(s.state==="walk" || s.state==="goto"){
    s.x = s.tx; s.y = s.ty; s.frame = 0;
    /* 关键：无论 goto/walk 到达，一律回到 roam —— 否则目标恰在 3px 内时 state 卡死在 goto，
       漫游决策块永远不再执行，精灵从此不再移动、表情也永远不变（曾致"不会动 + 表情卡住"） */
    s.state = "roam"; s.restT = rnd(1.5, 3.5);
  }
  /* 漫游决策 */
  if(s.state==="roam"){
    s.restT -= dt;
    if(s.restT <= 0){
      if(making || fly || checkin){
        /* 打卡流程中：守在旁观位看主人做甜品，不乱跑（旧行为靠 goto 卡住实现，冻结修复后需显式守卫） */
        if(Math.hypot(s.x-MAKING_SPRITE.x, s.y-MAKING_SPRITE.y) > 4) spriteGoto(MAKING_SPRITE.x, MAKING_SPRITE.y, 170);
        s.restT = rnd(2, 3.5);
      } else {
        const a = pick(ANCHORS);
        /* 罐口锚点（空中）垂直锁在罐沿上，不往罐口里沉；地面锚点保留随机抖动 */
        const nx = a.x + rnd(-14,14), ny = (a.y < 400) ? Math.min(a.y, 234) : a.y + rnd(-8,8);
        if(Math.hypot(nx - s.x, ny - s.y) < 24){
          s.restT = rnd(.6, 1.4);                             /* 新目标几乎原地：稍后再选，绝不发 3px 内的 goto（防冻结） */
        } else {
          spriteGoto(nx, ny, rnd(80,130));
          /* 出发时偶尔露出惊讶小表情，但受冷却约束，不会频繁变脸 */
          if(s.emoteT <= 0){ s.emote = Math.random() < 0.2 ? "surprised" : "blink"; s.emoteT = rnd(10,18); }
        }
      }
    } else if(s.emoteT <= 0){
      /* 静息时隔一段时间（10~18s）才换一个表情，避免频繁变脸 */
      s.emote = pick(["blink","curious","sleep","wink","shy","blink","wink"]);
      s.emoteT = rnd(10,18);
    }
  }
}

/* ============================================================
   粒子系统
   ============================================================ */
const particles = [];
const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function spawn(type, x, y, n, opts={}){
  if(reduced && (type==="gold"||type==="petal")) n = Math.min(n, 3);
  for(let i=0;i<n;i++){
    const p = { type, x, y, t:0, life: opts.life || rnd(.5,1), rot: rnd(0,6.3),
      vx: opts.vx!==undefined ? opts.vx+rnd(-20,20) : rnd(-40,40),
      vy: opts.vy!==undefined ? opts.vy+rnd(-20,20) : rnd(-90,-30),
      size: opts.size || rnd(2.5,4.5),
      col: opts.col || pick(["#FFD66B","#FFE9A8","#FFB84D"]), g: opts.g ?? 240 };
    particles.push(p);
  }
}
function stepParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.t += dt; p.x += p.vx*dt; p.y += p.vy*dt;
    if(p.type==="steam"){ p.vy -= 30*dt; p.vx += Math.sin(p.t*3)*8*dt; }
    else p.vy += p.g*dt;
    if(p.type==="petal"){ p.vx = Math.sin(p.t*2.2)*22; }
    p.rot += dt*6;
    if(p.t > p.life) particles.splice(i,1);
  }
}
function fadeCol(col, a){
  if(col.startsWith("rgba")||col.startsWith("rgb(")) return col;
  return hexA(col, a);
}
function drawParticles(c){
  for(const p of particles){
    const a = Math.max(0, 1 - p.t/p.life);
    /* 金色星星双明度交替闪烁（8-bit 帧动画感） */
    const flick = (p.type==="gold"||p.type==="star") && Math.floor(p.t*14)%2===0;
    const col = flick ? (p.col==="#FFD66B" ? "#FFE9A8" : p.col==="#FFE9A8" ? "#FFD66B" : p.col) : p.col;
    if(p.type==="gold"){
      const r = Math.max(PIX, p.size*(p.t<.15 ? p.t/.15 : 1));
      pStar(c, p.x, p.y, r, col);
    } else if(p.type==="star"){
      pStar(c, p.x, p.y, Math.max(PIX, p.size*1.8*(p.t<.15 ? p.t/.15 : 1)), col);
    } else if(p.type==="steam"){
      pCircle(c, p.x, p.y, p.size+p.t*14, fadeCol(col, a*.5));
    } else if(p.type==="petal"){
      P(c, p.x, p.y, p.size*1.4, p.size*.9, fadeCol(col, a));
    } else { /* dust / crumb */
      const s = Math.max(PIX, p.size*(1-p.t/p.life)+1);
      P(c, p.x, p.y, s, s, fadeCol(col, a*.85));
    }
  }
}

/* ============================================================
   主循环
   ============================================================ */
let lastT = performance.now(), ambientT = 0, jarShake = 0, jarGlow = 0;
function update(dt){
  ambientT += dt;
  updateSprite(dt);
  stepParticles(dt);
  updateSealAnim(dt);
  if(packAnim){ packAnim.t += dt; if(packAnim.t >= packAnim.dur) packAnim = null; }
  if(making){
    if(making.popT>0) making.popT = Math.max(0, making.popT - dt*2.2);
    if(making.stage===2 && making.coatT<1){
      making.coatT = Math.min(1, making.coatT + dt/1.4);
      /* 糖霜屑从绕圈涂抹头位置掉落 */
      const a = -Math.PI/2 + making.coatT*Math.PI*2, hr = foodCell(MAKE_TARGET, making.foodId)*(FOODS[making.foodId].ringR||7.4);
      const hx = TRAY.x + Math.cos(a)*hr, hy = TRAY.y + Math.sin(a)*hr;
      if(Math.random()<dt*20) spawn("crumb", hx+rnd(-6,6), hy+rnd(-6,6), 1,
        {vy:rnd(30,90), life:.55, size:2, col:"#FFF3D8", g:300});
    }
  }
  if(jarShake>0) jarShake = Math.max(0, jarShake - dt);
  if(jarGlow>0) jarGlow = Math.max(0, jarGlow - dt);
  /* 罐身偶尔闪过一粒小星星（idle 小惊喜） */
  if(!making && Math.random() < dt*.22){
    spawn("star", JAR.x+rnd(-100,100), JAR.y+rnd(24,250), 1,
      {vy:-6, life:.9, size:2, col: pick(["#FFF3C9","#FFE9A8"]), g:0});
  }
  /* 氛围粒子 */
  if(Math.random() < dt*1.2){
    const theme = THEME_MAP[activeJar().themeId] || THEMES[0];
    if(theme.decor==="oden" && Math.random()<.6) spawn("steam", rnd(562,598), 472, 1, {life:1.6, size:3, g:-20, vy:-24});
    else if(theme.decor==="oden" && Math.random()<.3) spawn("steam", rnd(566,594), 466, 1, {life:1.8, size:2.5, g:-16, vy:-20});
    else if(theme.decor==="basket") spawn("petal", rnd(100,760), -10, 1, {life:6, size:3, g:14, vy:26, col: pick(["#FFF3D8","#FFE9A8","#D9ECFF"])});
    else if(theme.decor==="sun") spawn("petal", rnd(100,760), -10, 1, {life:6, size:3, g:14, vy:26, col:"#FFE9A8"});
    else spawn("petal", rnd(100,760), -10, 1, {life:7, size:2.6, g:12, vy:24, col: pick(["#FFF3D8","#FFE9A8","#D9ECFF","#D9F2E4"])});
  }
}
/* ============================================================
   离屏缓存 —— 房间与罐子 95% 是静态的，按 key 缓存整层，
   每帧只画动态元素（托盘/飞行/精灵/粒子），保住 60fps。
   ============================================================ */
let bgCanvas = null, bgKey = "";
function getBG(theme, jar){
  const night = !!state.night;
  const key = theme.id + "|" + (night?1:0) + "|" + stage.width;
  if(bgKey === key && bgCanvas) return bgCanvas;
  if(!bgCanvas || bgCanvas.width !== stage.width || bgCanvas.height !== stage.height){
    bgCanvas = document.createElement("canvas");
    bgCanvas.width = stage.width; bgCanvas.height = stage.height;
  }
  const bc = bgCanvas.getContext ? bgCanvas.getContext("2d") : null;
  if(!bc) return bgCanvas;
  setT(stage.width / W, 0, 0);                 /* 与主画布同一变换 → 合成时 1:1 零采样 */
  bc.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
  drawRoom(bc, theme, night);
  bgKey = key;
  return bgCanvas;
}
let jarCanvas = null, jarKey = "";
function drawJarCached(c, jar, shake){
  const key = jar.themeId + "|" + jar.foodId + "|" + jar.count + "|" + jar.items.length + "|" + stage.width;
  if(key !== jarKey || !jarCanvas || jarCanvas.width !== stage.width || jarCanvas.height !== stage.height){
    if(!jarCanvas || jarCanvas.width !== stage.width || jarCanvas.height !== stage.height){
      jarCanvas = document.createElement("canvas");
      jarCanvas.width = stage.width; jarCanvas.height = stage.height;
    }
    const jc = jarCanvas.getContext ? jarCanvas.getContext("2d") : null;
    if(jc){
      setT(stage.width / W, 0, 0);             /* 与主画布同一变换 → 1:1 零采样合成 */
      jc.clearRect(0, 0, jarCanvas.width, jarCanvas.height);
      drawJar(jc, jar, 0);
      jarKey = key;
    }
  }
  const sx = shake>0 ? Math.sin(shake*40)*4*(1-shake) : 0;
  c.save(); c.translate(sx*CUR.K, 0);
  c.drawImage(jarCanvas, 0, 0);
  c.restore();
}
function render(){
  if(!ctx) return;
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = "#FBF3E4";
  ctx.fillRect(0, 0, stage.width, stage.height);
  const jar = activeJar();
  const night = !!state.night;
  ctx.drawImage(getBG(THEME_MAP[jar.themeId]||THEMES[0], jar), 0, 0);
  drawDecorOverlay(ctx, night, performance.now()/1000);   /* 淡紫花环 + 闪烁星星 + 悬挂挂饰（画在罐子之前，仍可见） */
  drawMedals(ctx, night);                                 /* 瓶子上方荣誉柜：当前目标已解锁的里程碑勋章 */
  if(sealAnim) drawSealAnim(ctx, performance.now()/1000);  /* 封存演出期间主罐让位给动画 */
  else if(packAnim) drawJar(ctx, jar, jarShake);           /* 压缩演出每帧重画（缓存会跟不上） */
  else drawJarCached(ctx, jar, jarShake);
  drawGifts(ctx, jar, performance.now()/1000);             /* 大罐两侧地面上已封存的礼品罐 */
  /* 入罐暖光：罐身染暖黄（画在罐子之后，才染得上） */
  if(jarGlow>0){
    pRoundRect(ctx, JAR.x-JAR.w/2, JAR.y, JAR.w, JAR.h, 22, "rgba(255,214,107,"+(jarGlow*.22)+")");
  }
  /* 打卡聚焦：舞台光托住中央大食物（不再全场压暗，画面保持明亮治愈） */
  if(making) drawSpotlight(ctx, TRAY.x, TRAY.y-6);
  drawTray(ctx);
  drawFly(ctx);
  drawParticles(ctx);
  /* 精灵画在专属顶层画布（z-index 高于左栏与场景），永远不被任何图层穿透 */
  if(slctx){
    slctx.clearRect(0, 0, spriteLayer.width, spriteLayer.height);
    setT(spriteLayer.width / W, 0, 0);
    drawSprite(slctx);
    setT(stage.width / W, 0, 0);
  } else {
    drawSprite(ctx);
  }
  updateSpeech();                       /* 标语气泡跟随精灵头顶 */
  positionMedalPlate();                 /* 荣誉柜目标名牌跟随柜顶 */
}
let lastFrameAt = 0, rafOn = false, fbId = 0;
function loop(maxDt){
  const t = performance.now();
  const dt = Math.min((t-lastT)/1000, maxDt || .05); lastT = t;
  update(dt); render();
  lastFrameAt = t;
  if(rafOn) requestAnimationFrame(loop);
}
/* rAF 兜底驱动：后台标签页 / 内置预览面板 / 部分 WebView 会暂停 rAF，
   画面和打卡流程就会"跑不起来"（停在第一帧、点击没反应）。
   超过 400ms 没有新帧，就用定时器补帧（放宽 dt 上限，按真实时间推进）。 */
function startDriver(){
  if(!rafOn){ rafOn = true; requestAnimationFrame(loop); }
  if(!fbId){ fbId = setInterval(()=>{ if(performance.now() - lastFrameAt > 400) loop(.25); }, 120); }
  document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) lastT = performance.now(); });
}
/* ============================================================
   UI 渲染 —— HUD / dock / 悬浮食材图标
   ============================================================ */
function renderHUD(){
  const jar = activeJar();
  const jdays = Object.keys(jar.history||{}).length;

/* 删除某个目标罐（含其打卡记录与勋章）；至少保留一个；删除后修正当前选中索引 */
function deleteJar(i){
  const jar = state.jars[i];
  if(!jar) return;
  if(state.jars.length<=1){ toast("至少留一个罐子哦～"); return; }
  if(!confirm(`确定删除目标「${jar.name}」吗？\n该罐的打卡记录和勋章会一并删除，无法恢复。`)) return;
  state.jars.splice(i,1);
  if(state.activeJar > i) state.activeJar--;
  else if(state.activeJar === i) state.activeJar = Math.min(i, state.jars.length-1);
  if(state.activeJar >= state.jars.length) state.activeJar = state.jars.length-1;
  if(state.activeJar < 0) state.activeJar = 0;
  save(); refreshAll(); paintStepIcons();
  toast("已删除目标「"+jar.name+"」");
}

let checkin = null; // { step:0, comboT }
function startCheckin(){
  if(checkin) return; /* 已在打卡流程中 */
  hideSpeech();       /* 开始打卡，先收起催打卡的标语 */
  const jar = activeJar();

  }
  ac(); /* 用户手势中初始化音频 */

  making = { foodId: randFood, stage: jar.todayProgress||0, coatT: (jar.todayProgress||0)>=2?1:0, special: 0, popT: 0, frost: genFrost(jar) };
  if(making.stage>0) making.stage = Math.min(making.stage, 3);

function clickStep(n){
  if(!checkin || !making) return;
  const jar = activeJar();

    sprite.emote = "shake"; sprite.shakeT = .6;

    return;
  }
  checkin.step = n;
  jar.todayProgress = n; jar.todayDate = todayStr(); save();

    making.stage = 1; making.popT = 1;
    SFX.pop();

    sprite.emote = "happy"; sprite.hopT = .5;

  } else if(n===3){ /* 点缀撒落 */
    making.stage = 3;

      {vy:rnd(40,130), life:.6, size:2.5, col: pick(["#FF6FA5","#7FD8F0","#FFE066","#7FB069"]), g:300});
    sprite.emote = "happy"; sprite.hopT = .6;

    if(quick){ spawn("star", TRAY.x, TRAY.y-66, 8, {vy:-140, life:.9, col:"#FFD66B"}); }

  updateStepButtons();

/* 入罐：期待脸 → 飞行 → 落罐 → 庆祝 */
let fly = null;
function finishCheckin(){
  const jar = activeJar();
  sprite.emote = "expect"; /* 期待脸 */
  setTimeout(()=>{
    fly = { t:0, dur:.5, foodId: making.foodId, special: (jar.count+1)%10===0 ? (jar.count+1) : 0, frost: making.frost };
    making = null;                       /* 期待脸结束 → 中央大食物退场，只留飞行那份（防双影） */
    sprite.emote = "cheer"; SFX.cheer();
  }, 850);
}
function flyStep(dt){
  if(!fly) return;
  fly.t += dt;
  if(fly.t >= fly.dur){
    const jar = activeJar();
    const seed = Math.floor(Math.random()*9999);
    jar.items.push({ foodId: fly.foodId, seed, special: fly.special, frost: fly.frost });
    jar.count++; jar.streak = (jar.lastDate===todayStr()) ? jar.streak : (jar.lastDate && dayDiff(jar.lastDate, todayStr())===1 ? jar.streak+1 : 1);
    jar.best = Math.max(jar.best, jar.streak);
    jar.lastDate = todayStr();
    jar.history[todayStr()] = (jar.history[todayStr()]||0)+1;
    state.globalStreak = state.lastGlobalDate===todayStr() ? state.globalStreak
      : (state.lastGlobalDate && dayDiff(state.lastGlobalDate, todayStr())===1 ? state.globalStreak+1 : 1);
    state.lastGlobalDate = todayStr();
    state.feedChances = Math.min(9, (state.feedChances|0) + 1);   /* 每次打卡得一次喂食机会（上限 9） */
    save(); refreshAll(); checkMilestones();   /* 打卡后检查里程碑勋章解锁 */
    fly = null; making = null; checkin = null;
    jarShake = .45; jarGlow = 1;
    SFX.jar(); setTimeout(()=>SFX.sparkle(), 120);
    /* 罐口金色粒子爆发 */
    const limited = jar.count%10===0;
    spawn("gold", JAR.x, JAR.y+4, limited?24:14, {vy:-190, life:.85, size:limited?4.5:3.4, g:420});
    if(limited){
      setTimeout(()=>SFX.cheer(), 200);
      toast("✨ 第 "+jar.count+" 枚 · 主题限定款！");
      sprite.emote = "love";
    } else {
      sprite.emote = "happy";
    }
    $("#step-bar").classList.remove("show");
    $("#check-btn").classList.remove("pulse"); /* 今日已完成，停止脉冲 */
    spriteSay(pick(SLOGAN_CHEER), 3800);       /* 打完卡当场夸一句 */
    /* 密度升级：第 21 枚起整罐压缩成小颗（这罐总共能装 50 枚） */
    if(jar.items.length === 21 && !packAnim){
      packAnim = { t:0, dur:.8 }; jarShake = .4;
      toast("罐子升级密度啦：食物变小，这罐能装 50 枚了～");
    }
    /* 满罐封存：达到总容量 → 扎成礼品罐收在地上，换新罐继续装 */
    if(jar.items.length >= JAR_CAP) sealJar(jar);
    setTimeout(()=>{ sprite.emote = "blink"; if(Math.random()<.3){ /* 舍不得，回来拍拍罐子 */
        sprite.emote="happy"; sprite.hopT=.5; SFX.pat();
        setTimeout(()=>spriteRoam(), 900);
      } else spriteRoam(); }, 1600);
  }
}
function drawFly(c){
  if(!fly || !c) return;
  const t = ease.out(Math.min(fly.t/fly.dur,1));
  const x = lerp(TRAY.x, JAR.x, t);
  const y = lerp(TRAY.y-20, JAR.y+10, t) - Math.sin(t*Math.PI)*80;
  const cell = lerp(foodCell(MAKE_TARGET, fly.foodId), foodCell(JAR_TARGET, fly.foodId), t);
  /* 拖尾 */
  c.save(); c.globalAlpha = .3;
  paintFood(c, fly.foodId, x-8, y-4, cell, 3, fly.special, fly.frost);
  c.restore();
  paintFood(c, fly.foodId, x, y, cell, 3, fly.special, fly.frost);
}

/* 单个目标的累计打卡天数（以 history 去重日数为准，count 兜底） */
function jarDays(jar){
  if(!jar) return 0;
  const h = jar.history || {};
  return Math.max(Object.keys(h).length, jar.count|0);
}
/* 打卡完成后检查里程碑：该目标累计达到阈值且未记录 → 记录达成日期 + 庆祝 + 弹成就 */
function checkMilestones(){
  const jar = activeJar(); if(!jar) return;
  const n = jarDays(jar);
  const newly = MILESTONES.filter(m => n >= m.days && !(jar.medals && jar.medals[m.days]));
  if(!newly.length) return;
  newly.forEach(m=>{ jar.medals[m.days] = todayStr(); });
  save();
  newly.sort((a,b)=>a.days-b.days);
  const top = newly[newly.length-1];
  sprite.emote = "cheer"; sprite.hopT = .7; SFX.cheer();
  setTimeout(()=>openMedalModal(top, jar.medals[top.days], jar.name), 420);
  toast(newly.length>1 ? ("🏅 「"+jar.name+"」一口气解锁了 "+newly.length+" 枚勋章！")
                       : ("🏅 「"+jar.name+"」解锁新勋章：" + top.title));
}

/* 演示 / 预览：用 ?demo=medals 打开，或控制台调用 __starjar.previewMedals()
   构造一份模拟累计打卡数据（每个目标独立解锁各自的里程碑），且不写盘、不污染真实存档 */
const DEMO = (typeof location!=="undefined") && /[?&]demo=medals/.test(location.search||"");
function fmtDate(d){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
/* 给一个罐子灌入指定天数的模拟打卡历史，并按阈值解锁它自己的勋章 */
function fillDemoJar(jar, days){
  const hist = {}, base = new Date();
  for(let i=0;i<days;i++){ const d = new Date(base); d.setDate(d.getDate()-i); hist[fmtDate(d)] = 1; }
  jar.history = hist; jar.count = days; jar.streak = days; jar.best = days;
  jar.lastDate = todayStr(); jar.medals = {};
  MILESTONES.forEach(m=>{
    if(days >= m.days){ const d = new Date(base); d.setDate(d.getDate() - (days - m.days)); jar.medals[m.days] = fmtDate(d); }
  });
  /* 演示罐内堆叠与封存：超过 50 天的目标 = 地上 1 袋封存的礼品罐 + 罐内 35 枚（第二档密度）；
     不超过 50 天的按天数装（>20 天即第二档密度），刚好展示「食物变小能装更多」 */
  jar.items = demoItems(jar, Math.min(days, 35));
  jar.archives = [];
  if(days > JAR_CAP){
    const sd = new Date(base); sd.setDate(sd.getDate() - (days - JAR_CAP));
    jar.archives.push({ id:"ademo"+Math.floor(Math.random()*99), sealedAt: fmtDate(sd),
      count: JAR_CAP, items: demoItems(jar, JAR_CAP), themeId: jar.themeId });
  }
  return jar;
}
/* 演示用：给罐子生成 n 枚随机食物（每第 10 枚彩虹限定款，和真实打卡一致） */
function demoItems(jar, n){
  const foods = (THEME_MAP[jar.themeId] || THEMES[0]).foods;
  const arr = [];
  for(let i=1;i<=n;i++) arr.push({ foodId: pick(foods), seed: Math.floor(Math.random()*9999),
    special: i%10===0 ? i : 0, frost: genFrost(jar) });
  return arr;
}
function buildDemoState(targetDays){
  const days = targetDays || 365;
  const s = defaultState();
  /* 目标一：累计满（默认 365 天 → 6 枚全解锁） */
  const jar = s.jars[0]; jar.name = "每天运动30分钟";
  fillDemoJar(jar, days);
  /* 目标二：进度少一些，用来展示「每个目标有自己独立的里程碑」 */
  const jar2 = defaultJar("每晚阅读20分钟", "fruit", "watermelon");
  fillDemoJar(jar2, Math.min(days, 42));
  s.jars.push(jar2);

/* ============================================================
   小精灵标语气泡（偶尔在头顶冒出）
   ============================================================ */
let speechTimer = null, speechCooldownUntil = 0;
function speechEl(){ return document.getElementById("sprite-speech"); }
function spriteSay(text, dur=3400){
  const el = speechEl(); if(!el) return;
  el.textContent = text; el.classList.add("show");
  clearTimeout(speechTimer);
  speechTimer = setTimeout(()=>el.classList.remove("show"), dur);
}
function hideSpeech(){ const el = speechEl(); if(el) el.classList.remove("show"); clearTimeout(speechTimer); }
/* 把精灵头顶的逻辑坐标映射到屏幕（CSS）坐标，气泡定位用 */
function spriteScreenPos(){
  const r = stage.getBoundingClientRect();
  const lyTop = sprite.y - SPR_LOGICAL * (SPR_BB.h / SPR_BB.w);   /* 精灵头顶逻辑 y */
  /* 锚在精灵「右上角」：右边缘 + 头顶，气泡从此向上、向右展开，绝不压住本体 */
  let sx = r.left + (sprite.x + SPR_LOGICAL/2) * (r.width / W);
  let sy = r.top + lyTop * (r.height / H);
  const minY = r.top + 56; if(sy < minY) sy = minY;              /* 别钻进 HUD */
  return { sx, sy };
}
function updateSpeech(){
  const el = speechEl(); if(!el || !el.classList.contains("show")) return;
  const p = spriteScreenPos();
  el.classList.remove("flip");                       /* 始终固定在精灵右上角，不做左右翻转（避免到处飘） */
  el.style.left = p.sx + "px";
  el.style.top  = p.sy + "px";
  /* 水平夹取：紧贴精灵右上角；若超出右边界则整体左移，保证整句文字都在屏内、不溢出 */
  const w = el.offsetWidth || 160;
  const maxLeft = Math.max(6, window.innerWidth - 6 - w);
  if(p.sx > maxLeft) el.style.left = maxLeft + "px";
  /* 顶部夹取：气泡在精灵头顶上方，别钻进顶部 HUD / 刘海区 */
  const h = el.offsetHeight || 36;
  const minTop = 58 + h;                             /* 锚点(y) 至少要够气泡整块落在 HUD 之下 */
  if(p.sy < minTop) el.style.top = minTop + "px";
}
