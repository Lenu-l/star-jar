/* 状态牌定位：按逻辑坐标找画面里真正空闲的一块（宽屏=左壁口袋；竖屏=可见区顶部），
   避开左栏 / HUD / 罐子左缘 / 盆栽，并随画布裁切（cover）自适应；窗口变化时重算 */
function positionSpriteCard(){
  const card = document.getElementById("sprite-card"); if(!card) return;
  /* 移动端竖屏（≤560px 且高≥宽）：场景用 contain 居中，下方留有一截空区；把状态牌锚到场景正下方、
     刚好填进这块空区（上移一点，不再贴着打卡台把底部留空），且不压到打卡台。
     横屏小窗（如 560×420）仍走桌面「墙面口袋」逻辑，避免贴左边压住目标栏 */
  if(window.innerWidth <= 560 && window.innerHeight >= window.innerWidth){
    const r = stage.getBoundingClientRect();
    if(!r.width || !r.height){ card.style.left=""; card.style.top=""; card.style.bottom=""; card.classList.remove("compact","slim"); updateSpriteCard(); return; }
    card.classList.remove("compact"); card.classList.add("slim");   /* 窄屏瘦身：机会数并进按钮文案，少占一行 */
    updateSpriteCard();                                             /* 先刷新文案，再量高度才准 */
    const ch = card.offsetHeight || 110;
    const dock = document.getElementById("dock");
    const dockTop = dock ? dock.getBoundingClientRect().top : (window.innerHeight - 80);
    let top = r.bottom + 10;                              /* 紧跟场景下方，填进空区 */
    const maxTop = dockTop - ch - 8;                     /* 别压到打卡台 */
    if(top > maxTop) top = Math.max(maxTop, r.bottom - ch);
    card.style.left = "8px";
    card.style.bottom = "auto";
    card.style.top = Math.max(8, top) + "px";
    return;
  }
  const r = stage.getBoundingClientRect();
  if(!r.width || !r.height) return;
  const sx = r.width / W, sy = r.height / H;                 /* 逻辑 → 屏幕缩放 */
  const visL = Math.max(0, -r.left / sx), visR = Math.min(W, (window.innerWidth  - r.left) / sx);
  const visT = Math.max(0, -r.top  / sy), visB = Math.min(H, (window.innerHeight - r.top ) / sy);
  card.classList.remove("compact", "slim");
  let lx, ly;
  const cw0 = card.offsetWidth / sx;                  /* 标准档逻辑宽 */
  if(606 + cw0 <= visR - 8){
    /* 宽屏：最右侧墙面（画框下方、地面摆件上方；精灵地面活动在 y≈490，不冲突） */
    lx = visR - cw0 - 8;
    ly = 205;
    ly = Math.min(ly, 440 - card.offsetHeight / sy);  /* 别压到右侧摆件顶（逻辑 452） */
    ly = Math.max(ly, visT + 70 / sy);                /* 别钻进 HUD */
  } else if(visL <= 130 && visR > 330){
    /* 降级：左壁口袋（逻辑 x 124–300：左栏右缘外、罐子左缘内；y 206 起：小窗下） */
    lx = Math.max(visL + 8, 124);
    ly = 206;
    let cw = card.offsetWidth;
    if(lx + cw / sx > 298){ card.classList.add("compact"); cw = card.offsetWidth; }  /* 口袋窄 → 紧凑档 */
    if(lx + cw / sx > 298){ card.classList.remove("compact"); card.classList.add("slim"); }  /* 还挤 → 迷你档 */
    ly = Math.min(ly, 426 - card.offsetHeight / sy);        /* 别压到盆栽顶（逻辑 430） */
    ly = Math.max(ly, visT + 70 / sy);                      /* 别钻进 HUD */
  } else {
    /* 竖屏 / 窄屏：可见区顶部左侧（罐口精灵之上、HUD 之下） */
    card.classList.add("slim");
    lx = visL + 12;
    ly = visT + 104 / sy;
  }
  card.style.left = (r.left + lx * sx) + "px";
  card.style.top  = (r.top  + ly * sy) + "px";
  updateSpriteCard();                                       /* 档位可能变了，顺手刷新按钮文案 */
}

  let best = null, bestD = 1e9;
  for(const h of medalHits){
    const dd = Math.hypot(p.x-h.x, p.y-h.y);
    if(dd < h.r && dd < bestD){ best = h; bestD = dd; }
  }
  if(best){
    const m = MILESTONES.find(x=>x.days===best.days);
    const jar = state.jars.find(j=>j.id===best.jarId) || activeJar();
    if(m){ openMedalModal(m, jar && jar.medals && jar.medals[best.days], jar && jar.name); return; }
  }
  /* 礼品罐（大罐两侧地面）：点开看这袋的详情 */
  for(const g of giftHits){
    if(Math.hypot(p.x-g.x, p.y-g.y) < g.r){
      const jar = state.jars.find(j=>j.id===g.jarId) || activeJar();
      const arch = jar && jar.archives && jar.archives.find(a=>a.id===g.archId);
      if(arch){ openGiftModal(arch, jar, g.idx+1); SFX.pop(); return; }
    }
  }
  /* 精灵 */
  if(Math.hypot(p.x-sprite.x, p.y-sprite.y) < 56){
    if(!state.spriteNamed){ openNameModal(); return; }      /* 还没名字 → 先引导取名 */
    sprite.emote = "love"; sprite.loveT = 2.6;              /* 被摸头：love 短暂停留后自动还原（loveT 见 updateSprite） */
    sprite.emoteT = Math.max(sprite.emoteT, 2.6);           /* 反应期间漫游冷却不许抢着换脸 */
    sprite.hopT = .6; SFX.pat();
    return;
  }
  /* 罐子 */
  if(p.x>JAR.x-JAR.w/2-20 && p.x<JAR.x+JAR.w/2+20 && p.y>JAR.y-20 && p.y<JAR.y+JAR.h+20){
    jarShake = .5; SFX.squish();
    spawn("dust", JAR.x+rnd(-30,30), JAR.y+30, 5, {vy:-50, life:.6, size:3, col:"#FFF3D8", g:160});
  }
}
stage.addEventListener("click", onStageTap);
$$("#step-bar .step-btn").forEach(b=>b.addEventListener("click", ()=>clickStep(+b.dataset.step)));
$("#check-btn").addEventListener("click", startCheckin);
$("#btn-add").addEventListener("click", ()=>openJarModal(null));
$("#btn-stats").addEventListener("click", openStatsModal);
$("#btn-help").addEventListener("click", openHelpModal);
$("#btn-night").addEventListener("click", ()=>{
  state.night = !state.night; bgKey = "";   /* 清缓存，房间层按新模式重绘 */
  save(); refreshNightBtn(); SFX.pop();
});
$("#modal-layer").addEventListener("click", e=>{ if(e.target.id==="modal-layer") closeModal(); });

/* ============================================================
   启动
   ============================================================ */
function boot(){
  if(DEMO){ SAVE_DISABLED = true; state = buildDemoState(365); }   /* 预览模式：模拟累计打卡，且不写盘 */
  else load();
  initSpriteImg();   /* 预烘焙罐罐精灵位图（沙箱/无 canvas 环境自动降级为空图） */
  if(!DEMO && LS_OK && !lsGet(LS_KEY)) save(); /* 首次启动即落盘（沙箱/预览环境跳过） */
  /* 兼容旧数据 & 修复缺省字段 */
  state.jars.forEach(j=>{
    j.todayProgress = j.todayProgress||0; j.todayDate = j.todayDate||"";
    j.items = j.items||[]; j.history = j.history||{};
    j.medals = j.medals||{};                     /* 每个目标独立的里程碑勋章 */
    if(j.todayDate!==todayStr()) j.todayProgress = 0;
  });
  /* 兼容旧存档：早期勋章是全局的，迁移到第一个目标名下（归属最接近的旧数据） */
  if(state.medals && typeof state.medals==="object" && Object.keys(state.medals).length){
    const j0 = state.jars[0];
    if(j0 && !Object.keys(j0.medals||{}).length) j0.medals = Object.assign({}, state.medals);
  }
  delete state.medals;
  /* 兼容旧存档：精灵名字字段宽容兜底 */
  if(typeof state.spriteName!=="string") state.spriteName="罐罐";
  if(typeof state.spriteNamed!=="boolean") state.spriteNamed=false;
  if(typeof state.feedChances!=="number" || state.feedChances<0) state.feedChances=0;   /* 喂食机会宽容兜底 */
  resize(); refreshAll(); paintStepIcons();
  /* 有未完成的三步进度 → 自动恢复 */
  const jar = activeJar();
  if(jar.todayDate===todayStr() && jar.todayProgress>0 && jar.todayProgress<3){
    checkin = { step: jar.todayProgress, comboT: performance.now() };
    making = { foodId: jar.foodId, stage: jar.todayProgress, coatT: jar.todayProgress>=2?1:0, special: 0, popT: 0, frost: genFrost(jar) };
    paintStepIcons(); updateStepButtons();
    $("#step-bar").classList.add("show");
    spriteGoto(MAKING_SPRITE.x, MAKING_SPRITE.y, 170);
  }
  if(!state.seenHelp) toast("点下方「打卡」按钮开始今天的目标 ✨");
  if(!LS_OK) toast("当前预览环境无法保存进度，把文件下载后用浏览器打开即可存档～");
  scheduleSlogans();   /* 偶尔让小精灵冒标语提醒 / 夸奖 */
  updateSpriteCard();                         /* 初始化状态牌内容（名字 / 心情 / 喂食机会） */
  positionSpriteCard();                       /* 再按画面空闲区定位（内部会随档位再刷新一次） */
  positionMedalPlate();                       /* 荣誉柜目标名牌定位 + 内容 */
  $("#sc-rename").addEventListener("click", openNameModal);     /* 点 ✏️ 改名 */
  $("#sc-name").addEventListener("click", openNameModal);       /* 没取名时点头像名也能取名 */
  $("#sc-feed-btn").addEventListener("click", feedSprite);      /* 点食物罐按钮喂食 */
  /* 窗口变化 → 重算状态牌位置（画布 cover 裁切会变） */
  window.addEventListener("resize", positionSpriteCard);
  window.addEventListener("orientationchange", ()=>setTimeout(positionSpriteCard, 120));
  startDriver();
}
/* 覆盖通用 update：加入飞行动力学（渲染交给 render 内的 drawFly） */
const _origUpdate = update;
update = function(dt){ _origUpdate(dt); flyStep(dt); };
/* 调试接口（控制台/自动化测试可用） */
window.__starjar = {
  get state(){ return state; }, get checkin(){ return checkin; }, get making(){ return making; },
  get particles(){ return particles; }, get sprite(){ return sprite; }, get fly(){ return fly; },
  get medalHits(){ return medalHits; },
  todayStr, defaultJar, THEMES, FOODS, spriteSay, hideSpeech, updateSprite,
  updateSpriteCard, positionSpriteCard,
  setName(n){ const v=((n||"").trim().slice(0,8))||"罐罐"; state.spriteName=v; state.spriteNamed=true; save(); updateSpriteCard(); return state.spriteName; },
  getName(){ return state.spriteNamed ? state.spriteName : ""; },
  feed(){ feedSprite(); },                       /* 调试：喂食 */
  getMood(){ return spriteMood(); },             /* 调试：当前心情 */
  getFeed(){ return state.feedChances|0; },      /* 调试：剩余喂食机会 */
  previewMedals(targetDays){ previewMedals(targetDays); },   /* 模拟累计打卡预览勋章墙（不写盘） */
  setNight(v){ state.night = !!v; bgKey = ""; },   /* 手动切换昼夜并重绘房间层 */
  /* 调试：把罐罐精灵单独渲染到任意尺寸画布（保持原型不变，仅叠加表情），供核对表情用 */
  renderSpriteTo(canvas, emote){
    const cx = canvas.getContext("2d"); if(!cx || !SPR_IMG) return;
    const oldCUR = CUR;
    const K = canvas.width / SPR_LOGICAL;           /* 让精灵铺满宽度（随 SPR_LOGICAL 自适应） */
    CUR = { K, VX:0, VY:0 };
    cx.clearRect(0,0,canvas.width,canvas.height);
    sprite.x = SPR_LOGICAL/2; sprite.y = Math.floor(canvas.height/K) - 2; sprite.tx = sprite.x; sprite.ty = sprite.y;
    sprite.state = "walk"; sprite.frame = 0; sprite.blinkT = 999; sprite.emote = emote||"blink";
    drawSprite(cx);
    CUR = oldCUR;
  },
};
/* 运行错误可见化：出问题弹提示，避免"看起来完全没反应" */
window.addEventListener("error", e=>{
  if(window.__errShown) return; window.__errShown = true;
  try{ toast("运行出了点问题：" + (e.message || "未知错误")); }catch(_){}
});
boot();
</script>
